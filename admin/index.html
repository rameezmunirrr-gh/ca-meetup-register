.stat[data-sheet]{cursor:pointer;transition:transform .12s,border-color .12s}.stat[data-sheet]:hover{border-color:var(--brand)}.stat[data-sheet]:active{transform:scale(.98)}.stat .more{display:block;margin-top:8px;font-size:.78rem;font-weight:700;color:var(--brand)}

.ov .big{font-size:2.2rem;font-weight:800;letter-spacing:.04em;margin:0 0 6px}.ov .name{font-size:2rem;font-weight:800;line-height:1.15;margin:10px 0 4px}.ov .sub{font-size:1.15rem;opacity:.95;margin:2px 0}.ov .lab{font-size:1.6rem;font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.18);border-radius:10px;padding:2px 14px;margin:8px 0}.ov .vm{border-color:#fff;color:#fff}

<body><header class="top"><div><img src="../assets/logo-mark.png" alt="" width="41" height="28"><span>Mallu Articles Bengaluru</span><small>Organiser</small></div></header><div class="kasavu"></div><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.js"></script>
<script>
const CFG={url:"https://jddrwajazpsdrqpwlncu.supabase.co",key:"sb_publishable_W3tJTLdbCOuwkUwkjLW1Iw_9m1zGHFT"};
const SIMILAR_BITS=8;                // images differing by <= this many of 1024 bits count as "possibly the same screenshot" (real tests: identical file = 0 bits; different PhonePe payments = 8 bits; different Google Pay payments = ~27)
const db=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(3,"0"),inr=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const S={staff:null,tab:"overview",bookings:[],tickets:[],scans:[],settings:null,mode:"both",f:{q:"",food:"",loc:"",att:"",pay:"",type:"",review:false,here:""},msg:"",charts:[],scanning:false,alert:null,log:[],payOpen:false,
  emails:{},emailsOk:false,fb:[],fbOk:false,transfers:[],buyers:[],tReady:false,money:null,ipf:null,showMoved:false};
function toast(t,ms){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2400)}

/* ---------- boot / auth ---------- */
async function boot(){
  const{data:{session}}=await db.auth.getSession();
  if(!session){S.staff=null;return view()}
  const{data,error}=await db.from("staff").select("name,role").eq("user_id",session.user.id).maybeSingle();
  if(error||!data){S.staff=null;S.msg="This account is not set up as an organiser yet. Ask the admin to add it.";await db.auth.signOut();return view()}
  S.staff=data;
  if(data.role==="admin"){await load();if(location.hash==="#gate")S.tab="gate"}else{S.tab="gate";await gLoad()}
  try{history.replaceState({tab:S.tab,sheets:[],y:0},"")}catch(_){}
  view();
}
async function load(){
  const[b,t,sc,st]=await Promise.all([db.from("bookings").select("*").order("created_at"),db.from("tickets").select("*").order("reg_seq"),db.from("screenshot_scans").select("*"),db.from("settings").select("*").eq("id",1).single()]);
  const e=b.error||t.error||sc.error||st.error;if(e){S.msg="Could not load data: "+e.message;return}
  S.bookings=b.data;S.tickets=t.data;S.scans=sc.data;S.settings=st.data;
  try{const r=await db.rpc("admin_registration_status");S.reg=r.error?null:r.data}catch(_){S.reg=null}
  try{const r=await db.rpc("admin_payment_alert");S.alert=r.error?null:r.data}catch(_){S.alert=null}
  try{const r=await db.from("settings_log").select("*").order("id",{ascending:false}).limit(200);S.log=r.error?[]:r.data}catch(_){S.log=[]}
  /* emails live in their own admin-only table; transfers and IP flags exist only after the Release 2 database update */
  try{const r=await db.from("ticket_emails").select("ticket_id,email");S.emailsOk=!r.error;S.emails=r.error?{}:Object.fromEntries(r.data.map(x=>[x.ticket_id,x.email]))}catch(_){S.emailsOk=false;S.emails={}}
  try{const r=await db.from("booking_feedback").select("booking_id,rating,comment,created_at,updated_at").order("updated_at",{ascending:false});S.fbOk=!r.error;S.fb=r.error?[]:r.data}catch(_){S.fbOk=false;S.fb=[]}
  try{const[x,y]=await Promise.all([db.from("transfers").select("*").order("created_at",{ascending:false}),db.from("transfer_buyers").select("*")]);
    S.tReady=!x.error&&!y.error;S.transfers=x.error?[]:x.data;S.buyers=y.error?[]:y.data;S.money=null;
    if(S.tReady){const m=await db.rpc("admin_transfer_money");S.money=m.error?null:m.data}}catch(_){S.tReady=false;S.transfers=[];S.buyers=[]}
  try{const r=await db.rpc("admin_ip_flags");S.ipf=r.error?null:r.data}catch(_){S.ipf=null}
  /* messages exist only after sql/r2_13 has been run; before that the Messages tab and card stay hidden */
  try{const[x,y]=await Promise.all([db.from("game_messages").select("*").order("created_at"),db.from("ticket_messages").select("ticket_id,message_id")]);

async function tAction(act,id){
  const x=S.transfers.find(y=>y.id===id);if(!x)return;const b=buyerOf(x);
  if(act==="ask")return tcall("admin_transfer_request_payment",{p_transfer:id},"The buyer can now see the payment screen");
  if(act==="shot")return shots([{path:x.payment_screenshot_path,label:"Buyer payment"+(b?" · "+b.name:"")}]);
  if(act==="verify"){const v=+($("#amt-"+id)||{}).value;if(!(v>=1))return toast("Type the amount that actually arrived in the bank",4000);
    if(!Number.isInteger(v))return toast("Type whole rupees only (no paise or decimals)",4000);
    const diff=x.amount_due!=null&&v!==x.amount_due;
    if(!confirm((diff?"CHECK THE AMOUNT: you asked the buyer for ₹"+x.amount_due+" but you typed ₹"+v+".\n"+(v<x.amount_due?"That is LESS than asked, so the seller will be owed less.":"That is MORE than asked.")+"\nPress OK only if ₹"+v+" really arrived.\n\n":"")+"Confirm: ₹"+v+" has arrived in the bank account for this transfer?\n\nThe seller will be owed exactly ₹"+v+"."))return;
    return tcall("admin_transfer_verify_payment",{p_transfer:id,p_amount:v},"Payment verified")}
  if(act==="approve"){
    if(!confirm("Transfer ticket "+sellerLbl(x)+" ("+x.seller_name+") to "+(b?b.name:"the buyer")+"?\n\n"+x.seller_name+"'s ticket is cancelled for good and "+(b?b.name:"the buyer")+" receives a new ticket number. This cannot be undone."))return;
    const r=await tcall("admin_transfer_approve",{p_transfer:id},"Done.");if(r&&r.new_label)toast("Transferred: "+r.old_label+" → "+r.new_label,5000);return}
  if(act==="reject"){
    const warn=x.kind==="public"&&x.payment_submitted_at?"\n\nThe buyer has already paid: the money will be marked as TO RETURN.":"";
    const note=prompt((x.status==="code_active"?"Cancel this code?":"Reject this transfer?")+warn+"\n\nOptional note (why):","");if(note===null)return;
    return tcall("admin_transfer_reject",{p_transfer:id,p_note:note.trim()||null},x.status==="code_active"?"Code cancelled":"Transfer rejected")}
  if(act==="extend"){const h=prompt("Keep this code valid for how many more hours from now? (1 to 168)","24");if(h===null)return;
    return tcall("admin_transfer_extend_code",{p_transfer:id,p_hours:parseInt(h,10)},"Code extended")}
  if(act==="paid"||act==="returned"){const ref=prompt(act==="paid"?"The seller was paid ₹"+x.amount_received+". Type the payment reference (for example the UPI transaction ID):":"The buyer's money was sent back. Type the payment reference (or a short note such as “no money received”):","");if(ref===null)return;
    return tcall(act==="paid"?"admin_transfer_mark_paid":"admin_transfer_mark_returned",{p_transfer:id,p_reference:ref.trim()},act==="paid"?"Seller marked as paid":"Return recorded")}
}

const GEV="Ehsaas'26",UNDO_MS=2*60*1000,QR_RE=/^E26-(\d{1,6})(C?)\|([0-9a-f]{12})$/i;
Object.assign(S,{ov:null,busy:false,cam:false,camErr:"",camAsk:false,stream:null,raf:0,last:0,lock:null,gfind:"",cool:0});
const gvm=f=>`<span class="vm ${f==="Veg"?"v":"n"}" aria-hidden="true"></span>${esc(f)}`;

/* gate staff load only what the gate needs; admins already have everything and only refresh who is checked in */
async function gLoad(){
  const cols="id,ticket_no,coord_no,kind,name,phone,food,booking_id,checked_in_at,reg_seq";
  let[t,b]=await Promise.all([db.from("tickets").select(cols+",transferred_out_at"),db.from("bookings").select("id,booking_code,status")]);
  if(t.error&&/transferred_out_at/.test(t.error.message||""))t=await db.from("tickets").select(cols);   // before the database update that adds transferred_out_at
  if(t.error||b.error){S.msg="Could not load the list: "+((t.error||b.error).message);return}
  S.tickets=t.data;S.bookings=b.data;S.msg="";
}
async function gSync(full){
  if(S.staff.role!=="admin")return gLoad();
  if(full)return load();
  const r=await db.from("tickets").select("id,checked_in_at");if(r.error)return;
  const m=new Map(r.data.map(x=>[x.id,x.checked_in_at]));S.tickets.forEach(t=>{if(m.has(t.id))t.checked_in_at=m.get(t.id)});
}
function gStats(){
  const P=S.tickets.filter(t=>!t.transferred_out_at&&bk(t.booking_id).status==="paid"),here=P.filter(t=>t.checked_in_at),f=(a,v)=>a.filter(t=>t.food===v).length;
  return{conf:P.length,here:here.length,vC:f(P,"Veg"),vH:f(here,"Veg"),nC:f(P,"Non-veg"),nH:f(here,"Non-veg")}
}
function gCounts(){const el=$("#counts");if(!el)return;const s=gStats();
  el.innerHTML=`<div><b>${s.here} / ${s.conf}</b><span>Present</span></div><div><b>${s.vH} / ${s.vC}</b><span><i class="vm v"></i>Veg present</span></div><div><b>${s.nH} / ${s.nC}</b><span><i class="vm n"></i>Non-veg present</span></div>`;gAdmitted();renderSheet()}
function vGate(){
  $("#v").innerHTML=`<div class="counts" id="counts"></div>
  <div class="card"><div class="cam"><video id="vid" playsinline muted></video><div class="frame"></div><div class="off" id="camoff">${S.cam?"":esc(S.camAsk?"Asking for camera permission… tap Allow.":S.camErr||"Camera is off")}</div></div>
    <div class="row"><button id="camtoggle" ${S.camAsk?"disabled":""}>${S.cam?"Stop camera":S.camAsk?"Asking…":S.camErr?"Try again":"Start camera"}</button></div>

function gResults(){

/* ---- result screens: stay until the gate person chooses ---- */
function gOverlay(){
  document.querySelectorAll(".ov").forEach(x=>x.remove());const o=S.ov;if(!o)return;
  const d=document.createElement("div");d.className="ov "+o.cls;d.setAttribute("role","alertdialog");d.innerHTML=o.html;document.body.appendChild(d);

function gClose(){S.ov=null;S.cool=Date.now()+1500;gOverlay()}   // short pause so the same ticket is not read twice
const gBtns=`<button data-act="next">Next scan</button><button class="line" data-act="home">Home page</button>`;
const gPerson=r=>`<div class="name">${esc(r.name||"")}</div>${r.label?`<div class="lab">${esc(r.label)}</div>`:""}${r.food?`<div class="sub">${gvm(r.food)}</div>`:""}${r.booking_code?`<div class="sub">Booking ${esc(r.booking_code)}${r.people_count>1?" · "+r.people_count+" people":""}</div>`:""}`;
function gResult(r){
  const kind=r.kind==="coordinator"?`<div class="sub">COORDINATOR</div>`:"";
  if(r.result==="ok"){r._at=r._at||Date.now();gShow("g",`<div class="big">ADMITTED ✓</div>${kind}${gPerson(r)}<button data-act="next">Next scan</button><button class="line" data-act="home">Home page</button><button class="line" data-act="undo">Undo</button>`,{res:r})}
  else if(r.result==="already_scanned"){const t=r.checked_in_at?gtm(r.checked_in_at):"";
    gShow("r",`<div class="big">ALREADY SCANNED</div>${kind}${gPerson(r)}<div class="sub">Entered at ${esc(t)}${r.checked_in_by?" · checked by "+esc(r.checked_in_by):""}</div>${gBtns}`)}
  else if(r.result==="pending")gShow("a",`<div class="big">PAYMENT PENDING</div>${kind}${gPerson(r)}<div class="sub">${inr(r.amount_expected)} expected</div>
    <button data-act="shot">View payment screenshot</button><div id="shotbox"></div><button data-act="approve">Approve and admit</button><button class="line" data-act="next">Don't admit, next scan</button><button class="line" data-act="home">Home page</button>`,{res:r})
  else if(r.result==="rejected")gShow("r",`<div class="big">PAYMENT REJECTED</div>${gPerson(r)}<div class="sub">Do not admit. Ask them to contact the organisers.</div>${gBtns}`)
  else if(r.result==="cancelled")gShow("r",`<div class="big">TICKET CANCELLED</div><div class="name">${esc(r.name||"")}</div><div class="sub">${esc(r.old_label||"This number")} is no longer valid.</div><div class="sub">Ask for their current ticket:</div><div class="lab">${esc(r.label||"")}</div>${gBtns}`)
  else gShow("r",`<div class="big">INVALID TICKET</div><div class="sub">This ticket is not valid.</div>${gBtns}`);
}
/* ---- undo: gate staff for 2 minutes, admins any time ---- */
async function gUndo(r){
  if(S.busy)return;S.busy=true;
  try{
    let x=await db.rpc("gate_undo_checkin",{p_id:r.id});
    if(x.error&&/could not find the function|does not exist|PGRST202/i.test((x.error.code||"")+" "+(x.error.message||"")))x=await db.rpc("undo_checkin",{p_id:r.id});
    if(x.error)throw x.error;
    gShow("n",`<div class="big">ADMISSION UNDONE</div><div class="name">${esc(r.name||"")}</div><div class="sub">${esc(r.label||"")} is marked as not present again.</div>${gBtns}`);
    await gSync();gCounts();gResults();
  }catch(e){const m=String((e&&e.message)||"");
    gShow("r",`<div class="big">COULDN'T UNDO</div><div class="name">${esc(r.name||"")}</div><div class="sub">${/NOT_ALLOWED/.test(m)?"Only an admin can undo this. Ask an admin.":/UNDO_EXPIRED/.test(m)?"It has been more than 2 minutes, so only an admin can undo this. Ask an admin.":esc(m.slice(0,120)||"Network problem. Try again.")}</div><button data-act="keep">Back</button><button class="line" data-act="home">Home page</button>`,{res:r})}
  S.busy=false;
}
/* ---- admitting ---- */
async function gAdmit(args){
  if(S.busy)return;S.busy=true;
  try{const{data,error}=await db.rpc("admit_ticket",args);if(error)throw error;gResult(data);await gSync(!!args.p_approve);gCounts();gResults()}
  catch(e){gShow("n",`<div class="big">COULDN'T CHECK</div><div class="sub">${esc(((e&&e.message)||"Network problem").slice(0,120))}</div><div class="sub">Check the internet and scan again. If it then says ALREADY SCANNED, the person was admitted.</div>${gBtns}`)}
  S.busy=false;
}
function gPayload(text){
  const m=QR_RE.exec(String(text||"").trim());
  if(!m){if(S.busy||S.ov)return;return gShow("r",`<div class="big">NOT A TICKET</div><div class="sub">This QR code is not an ${esc(GEV)} ticket.</div>${gBtns}`)}
  return gAdmit({p_ticket_no:+m[1],p_secret:m[3].toLowerCase(),p_approve:false,p_coord:m[2].toUpperCase()==="C"});
}
/* ---- camera ---- */
async function gCamStart(){
  S.camErr="";S.camAsk=true;view();
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
    S.cam=true;try{S.lock=await navigator.wakeLock.request("screen")}catch(_){}
  }catch(e){S.cam=false;S.camErr=/denied|NotAllowed|Permission/i.test(String(e&&(e.name||e.message)))?"The camera is blocked for this page. Tap the lock icon next to the web address, open Permissions, set Camera to Allow, then tap Try again. Or use the search below.":"Couldn't start the camera. Tap Try again, or use the search below."}
  S.camAsk=false;view();
}

  const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});

  const shT=t.closest&&t.closest("[data-sheet]");if(shT){const[k,i]=sp(shT.dataset.sheet,2);return openSheet(k,i)}
  if(t.dataset.gotab){const[tab,k,i]=sp(t.dataset.gotab,3);return gotoTab(tab,k,i)}
  if(t.dataset.tab){if(t.dataset.tab===S.tab&&!S.sheets.length)return view();return nav({tab:t.dataset.tab,sheets:[]})}
    if(t.dataset.undo){
    if(!confirm("Undo this check-in?"))return;
    const r=await db.rpc("undo_checkin",{p_id:t.dataset.undo});
    if(r.error)return toast("Failed: "+r.error.message);
    await load();view();return toast("Check-in undone");
  }
  if(id==="csv")return csv();
  if(t.dataset.jump){document.getElementById(t.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.chip!==undefined){S.f.pay=t.dataset.chip;vBookings();return}
  if(t.dataset.shot){const b=bk(t.dataset.shot),F=flags()[b.id]||[],items=[{path:b.screenshot_path,label:b.booking_code}];
    S.scans.filter(s=>s.booking_id!==b.id).forEach(s=>{const o=bk(s.booking_id);if(F.some(x=>x.includes(o.booking_code)))items.push({path:o.screenshot_path,label:o.booking_code+" (flagged match)"})});return shots(items)}
  if(t.dataset.st){const r=await db.rpc("set_booking_status",{p_booking:t.dataset.b,p_status:t.dataset.st});if(r.error)return toast("Failed: "+r.error.message);await load();view();return toast("Marked "+t.dataset.st+(t.dataset.st==="paid"?". Ticket numbers given.":""))}
  if(t.dataset.co){const tk=S.tickets.find(x=>x.id===t.dataset.t),make=t.dataset.co==="make";if(!tk)return;
    const msg=make?"Make "+tk.name+" a coordinator?"+(tk.ticket_no!=null?"\n\nTheir guest number "+tlabel(tk)+" will be cancelled and they will get the next coordinator number. Other numbers do not change.":"\n\nThey will get the next coordinator number (E26-"+pad(S.settings.next_coord)+"C)."):"Remove "+tk.name+" as coordinator?\n\nThe coordinator number is retired and never reused. They go back to being a guest.";
    if(!confirm(msg))return;
    const r=await db.rpc("set_coordinator",{p_ticket_id:tk.id,p_make:make});if(r.error)return toast(/ALREADY_TRANSFERRED/.test(r.error.message||"")?"This ticket was already transferred to someone else, so its coordinator status cannot be changed.":"Failed: "+r.error.message);
    await load();view();return toast(make?tk.name+" is now "+r.data.label:tk.name+" is a guest again")}
  if(id==="scan")return runScan(S.bookings.filter(b=>b.kind!=="transfer"&&b.status!=="rejected"&&!S.scans.some(s=>s.booking_id===b.id)));
  if(id==="rescanall")return runScan(S.scans.map(s=>bk(s.booking_id)).filter(b=>b.status!=="rejected"));
  if(id==="rescan")return runScan(S.scans.filter(s=>!s.read_ok||!s.amounts).map(s=>bk(s.booking_id)).filter(b=>b.status!=="rejected"));
  if(t.dataset.tact)return tAction(t.dataset.tact,t.dataset.id);
  if(id==="tsave"){const s0=S.settings,cv=$("#tcut").value,on=$("#topen").checked,h=+$("#thours").value;
    if(!(h>=1&&h<=168))return toast("Code validity must be 1 to 168 hours",4000);
    if(on&&!s0.transfers_open&&!confirm("Switch ticket transfers ON?\n\nPeople will be able to start transfers straight away. Only do this once the transfer system has been tested."))return;
    const r=await db.rpc("admin_set_transfer_settings",{p_open:on,p_food_locked:$("#tfood").checked,p_code_hours:h,p_clear_cutoff:!cv&&!!s0.transfer_cutoff_at,p_cutoff:cv?new Date(cv+":00+05:30").toISOString():null});
    if(r.error)return toast(terr(r.error),6000);await load();view();return toast("Transfer settings saved")}
  if(id==="askemailsave"){const r=await db.rpc("admin_set_ask_email",{p_ask:$("#askemail").checked});if(r.error)return toast(terr(r.error),6000);await load();view();return toast("Email setting saved")}
  if(id==="askfbsave"){const r=await db.rpc("admin_set_ask_feedback",{p_ask:$("#askfb").checked});if(r.error)return toast(terr(r.error),6000);await load();view();return toast("Feedback setting saved")}
  if(id==="aboutsave"){const r=await db.rpc("admin_set_show_about",{p_show:$("#aboutshow").checked});if(r.error)return toast(terr(r.error),6000);await load();view();return toast("About link saved")}
  if(id==="ipsave"){const n=+$("#ipth").value;if(!(n>=2&&n<=1000))return toast("Use a number from 2 to 1000",4000);
    const r=await db.rpc("admin_set_transfer_settings",{p_ip_threshold:n});if(r.error)return toast(terr(r.error),6000);await load();view();return toast("Saved")}
  if(id==="ipclear"){if(!confirm("Delete every stored network address?\n\nDo this only after the event. It cannot be undone, and the repeat-registration flags will disappear."))return;
    const r=await db.rpc("admin_clear_client_ips");if(r.error)return toast(terr(r.error),6000);await load();view();return toast(r.data+" stored addresses deleted")}
  if(id==="evsave"){
    const v=$("#sev").value,vn=$("#svenue").value.trim();
    if(!v)return toast("Choose the event date and time");
    if(!vn)return toast("Type the venue");
    const r=await db.rpc("admin_set_event",{p_event_at:new Date(v+":00+05:30").toISOString(),p_venue:vn});
    if(r.error)return toast("Failed: "+r.error.message);await load();view();toast("Event details saved")}
  if(id==="pchange"){S.payOpen=true;view();setTimeout(()=>$("#pupi")&&$("#pupi").focus(),0)}
  if(id==="pcancel"){S.payOpen=false;view()}
  if(id==="psave"){
    const u=$("#pupi").value.trim(),n=$("#ppayee").value.trim(),w=$("#pwa").value.trim(),o=S.settings;
    if(!confirm("Change the payment details?\n\nUPI ID: "+(o.upi_id||"(none)")+"  →  "+u+"\nPayee: "+(o.payee_name||"(none)")+"  →  "+n+"\nWhatsApp: "+(o.whatsapp_number||"(none)")+"  →  "+w+"\n\nNew payments will go to this UPI ID straight away. The other admin will be shown a notice."))return;
    const r=await db.rpc("admin_set_payment_info",{p_upi:u,p_payee:n,p_whatsapp:w});
    if(r.error){const m=(r.error.message||"").match(/[A-Z_]{6,}/);return toast(PAY_ERR[m&&m[0]]||("Failed: "+r.error.message))}
    S.payOpen=false;await load();view();toast("Payment details saved")}
  if(id==="ssave"){
    if($("#sclose").value&&$("#sclose").value===$("#sreopen").value)return toast("Close time and reopen time must be different");
    const r=await db.rpc("admin_update_settings",{p_cap:+$("#scap").value,p_price:+$("#sprice").value,p_deadline:$("#sdl").value?new Date($("#sdl").value+":59+05:30").toISOString():null,p_is_open:$("#sopen").checked,
      p_pause_enabled:$("#spause").checked,p_pause_close:$("#sclose").value||null,p_pause_open:$("#sreopen").value||null});
    if(r.error)return toast("Failed: "+r.error.message);await load();view();toast("Settings saved")}
});
document.addEventListener("change",e=>{const t=e.target;
  if(S.staff&&S.staff.role==="admin"&&S.msgOk&&msgChange(t))return;
  if(t.id==="sopen"&&$("#pausebox"))$("#pausebox").style.display=t.checked?"block":"none";
  if(t.id==="mode"){S.mode=t.value;view()}
  if(t.id==="fmoved"){S.showMoved=t.checked;tPeople()}
  if(t.dataset.tcall){tcall("admin_transfer_confirm_call",{p_transfer:t.dataset.tcall,p_confirmed:t.checked},t.checked?"Call confirmed":"Call tick removed")}
  if(["fpay","ffood","floc","fatt","ftype","fhere","frev"].includes(t.id)){S.f.pay=$("#fpay")?.value??S.f.pay;if($("#ffood")){S.f.food=$("#ffood").value;S.f.loc=$("#floc").value;S.f.att=$("#fatt").value;S.f.type=$("#ftype").value;S.f.here=$("#fhere").value}if($("#frev"))S.f.review=$("#frev").checked;S.tab==="people"?tPeople():tBookings()}});
document.addEventListener("input",e=>{if(e.target.id==="lbody"){S.mf.lot.body=e.target.value;return}if(e.target.id==="ln"){S.mf.lot.n=e.target.value;return}if(e.target.id==="mname"){S.mf.name=e.target.value;return}if(e.target.id==="mbody"){S.mf.body=e.target.value;return}if(e.target.id==="gfq"){S.gfind=e.target.value;gResults();return}if(e.target.id==="gq"){S.gq=e.target.value;gSearch();return}if(e.target.id==="q"){S.f.q=e.target.value;S.tab==="people"?tPeople():tBookings()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="pw"||e.target.id==="em"))$("#login").click()});
boot();
</script></body></html>
