<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ec">
<title>Ehsaas'26 – Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#faf6ec;--card:#fffdf8;--ink:#17261f;--mute:#5f6d64;--green:#0e5a43;--green-d:#0a3f2f;--gold:#c39a3c;--gold-ink:#86621a;--line:#ebe3cd;--line2:#d9cca6;--err:#a8261d;--ok:#17803d;--warn:#9a6200;--on:#fffdf8;--serif:"Cormorant Garamond",Georgia,serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg) linear-gradient(180deg,#fffdf7 0,var(--bg) 380px) no-repeat;color:var(--ink);font:400 16px/1.6 "Jost",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
.kasavu{height:6px;background:repeating-linear-gradient(90deg,var(--gold) 0 22px,var(--bg) 22px 26px,var(--green) 26px 40px,var(--bg) 40px 44px)}
main{max-width:560px;margin:0 auto;padding:12px 18px 64px}
h1{font:600 clamp(2.3rem,9vw,3rem)/1.04 var(--serif);color:var(--green);margin:22px 0 8px;letter-spacing:-.01em}
h2{font:600 1.6rem/1.15 var(--serif);color:var(--green);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin:0 0 16px;box-shadow:0 14px 32px -22px rgba(14,90,67,.3)}
label,.lbl{display:block;font-weight:500;font-size:.93rem;margin:16px 0 8px}
input[type=text],input[type=tel],input[type=file]{width:100%;font:inherit;padding:14px 16px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#9aa59e}
input[type=text]:focus,input[type=tel]:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(14,90,67,.12);outline:none}
input[type=file]{border-style:dashed;background:#fffcf3;padding:14px}
input[type=file]::file-selector-button{margin-right:14px;border:1px solid var(--green);background:transparent;color:var(--green);border-radius:10px;padding:8px 14px;font:500 .95rem "Jost",sans-serif;cursor:pointer}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opts label{margin:0;font-weight:400;position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:11px 20px;border:1px solid var(--line2);border-radius:999px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.opts span:hover{border-color:var(--gold)}
.opts input:checked+span{background:var(--green);color:var(--on);border-color:var(--green);box-shadow:0 6px 14px -8px rgba(14,90,67,.8)}
.opts input:focus-visible+span,button:focus-visible,a.btn:focus-visible{outline:3px solid var(--gold-ink);outline-offset:3px}
button,a.btn{font:500 1rem/1.2 "Jost",system-ui,sans-serif;letter-spacing:.02em;border-radius:12px;padding:15px 22px;border:1px solid var(--green);background:var(--green);color:var(--on);cursor:pointer;display:inline-block;text-align:center;text-decoration:none;box-shadow:0 10px 20px -12px rgba(14,90,67,.8);transition:background .15s,border-color .15s}
button:hover,a.btn:hover{background:var(--green-d)}
button:active{transform:translateY(1px)}
button.ghost,a.btn.ghost{background:transparent;color:var(--green);box-shadow:none;border-color:var(--line2)}
button.ghost:hover,a.btn.ghost:hover{background:#f4ecd6;border-color:var(--gold)}
button.big{padding:19px 22px;font-size:1.08rem}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.row>button,.row>a.btn{flex:1 1 140px}
.row.col{flex-direction:column;margin-top:0}.row.col>button{flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked{background:var(--green)}.sw input:checked:after{transform:translateX(22px)}
.sw input:focus-visible{outline:3px solid var(--gold-ink);outline-offset:3px}
.err{color:var(--err);font-size:.92rem;margin:8px 0 0}
.errbox{border-color:#e3a7a1;background:#fdf1ef;color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;font-weight:500;color:var(--mute)}tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
.amt{font:600 3.2rem/1 var(--serif),"Jost",sans-serif;color:var(--green)}
.qr{display:block;margin:18px auto;width:min(260px,100%);height:auto;border-radius:14px;border:8px solid #fff;background:#fff;box-shadow:0 0 0 1px var(--line2),0 16px 30px -16px rgba(14,90,67,.4)}
.upi{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.upi code{padding:9px 12px;border:1px dashed var(--line2);border-radius:10px;background:#fffcf3}
a#qrlink{display:block;text-decoration:none;-webkit-tap-highlight-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green-d);color:var(--on);padding:11px 18px;border-radius:999px;z-index:9;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.note{font-size:.9rem;color:var(--mute)}
[hidden]{display:none!important}
#gbar{position:sticky;top:0;z-index:5;background:#fdf1d0;color:#5a3a00;padding:12px 18px;text-align:center;font-weight:500;font-size:.95rem;border-bottom:1px solid #e6c97a}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;border:1px solid var(--line2);font-size:.85rem;font-weight:500;white-space:nowrap}
.p-ok{color:#0f6a35;background:#e9f5ec;border-color:#bfe0c8}.p-wait{color:#7a4d00;background:#fdf3dc;border-color:#ecd49a}.p-bad{color:var(--err);background:#fcecea;border-color:#f0c2bd}
ul.names{margin:12px 0 0;padding-left:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button.chip{padding:8px 14px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line2);letter-spacing:.06em;font-weight:500;box-shadow:none}
canvas.tk{display:block;width:100%;height:auto;border-radius:22px;box-shadow:0 22px 44px -20px rgba(14,90,67,.45)}
/* invitation (home) */
.invite{background:var(--card);border:1px solid var(--line2);border-radius:22px;margin:22px 0 24px;overflow:hidden;box-shadow:0 28px 54px -30px rgba(14,90,67,.45);animation:rise .8s ease both}
.invite .band{height:12px;background:repeating-linear-gradient(90deg,var(--gold) 0 22px,transparent 22px 26px,var(--green) 26px 40px,transparent 40px 44px)}
.invite .inner{margin:12px;border:1px solid var(--line);border-radius:14px;padding:30px 22px 14px;text-align:center}
.pres{font:italic 500 1.25rem/1.3 var(--serif);color:var(--gold-ink);margin:0}
.invite h1{font-size:clamp(3.6rem,19vw,5.4rem);margin:6px 0 0;line-height:.95}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 14px;width:230px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.orn i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.orn b{width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.when{margin:0;text-align:left}
.when div{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:baseline;padding:14px 2px;border-top:1px solid var(--line)}
.when dt{font:italic 500 1.15rem var(--serif);color:var(--gold-ink)}
.when dd{margin:0;font:600 1.4rem/1.2 var(--serif);color:var(--ink)}
/* progress + done */
.steps{display:flex;list-style:none;margin:16px 0 4px;padding:0}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:.85rem;color:var(--mute)}
.steps i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:500;font-size:.85rem;border:1px solid var(--line2);background:var(--card);position:relative;z-index:1}
.steps li:not(:last-child):after{content:"";position:absolute;top:15px;left:calc(50% + 22px);right:calc(-50% + 22px);height:1px;background:var(--line2)}
.steps li.done:not(:last-child):after{background:var(--green)}
.steps li.done i{background:var(--green);border-color:var(--green);color:var(--on)}
.steps li.cur{color:var(--green);font-weight:500}.steps li.cur i{border-color:var(--gold);color:var(--green);box-shadow:0 0 0 4px rgba(195,154,60,.2)}
.seal{width:64px;height:64px;border-radius:50%;margin:26px auto 0;display:grid;place-items:center;font-size:1.7rem;color:var(--on);background:var(--green);box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--gold);animation:rise .6s ease both}
.seal+h1,.seal+h1+.sub{text-align:center;margin-left:auto;margin-right:auto}
.idcard{text-align:center;border-color:var(--line2);background:linear-gradient(180deg,#fffdf8,#fbf5e4)}
.foot{text-align:center;margin:36px 0 0;color:var(--mute);font:italic 500 1.05rem var(--serif)}
.amt,h1,h2,.when dd,.when dt,.pres,.foot{font-variant-numeric:lining-nums}
.idcard .amt{font:600 2.4rem/1.1 "Jost",system-ui,sans-serif;letter-spacing:.1em;font-variant-numeric:lining-nums}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.invite,.seal{animation:none}}
</style></head>
<body>
<div class="kasavu"></div>
<div id="gbar" role="status" aria-live="polite" hidden></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG: change these in one place ===== */
const CONFIG={
  eventName:"Ehsaas'26",
  eventLine:"Sun 22 Nov 2026, 2 PM · Savoury Business Hotel, Madiwala",
  ticketDate:"Sunday, 22 November 2026",          // shown on the ticket
  ticketTime:"2:00 PM",                            // shown on the ticket
  ticketVenue:"Savoury Business Hotel, Madiwala",  // shown on the ticket
  organiserName:"Mallu Articles Bengaluru",        // shown on the ticket
  ticketTagline:"MALAYALEE CA MEETUP · BENGALURU", // small line at the top of the ticket
  // The UPI ID, the payee name and the organisers' WhatsApp number are NOT here any more:
  // they are set in Admin > Settings > Payment details and read from the database.
  supabaseUrl:"https://jddrwajazpsdrqpwlncu.supabase.co",
  supabaseKey:"sb_publishable_W3tJTLdbCOuwkUwkjLW1Iw_9m1zGHFT"   // publishable key: safe to be public
};
let db=null;try{db=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false}})}catch(_){}

function uuid(){if(crypto.randomUUID)return crypto.randomUUID();
  return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==="x"?r:(r&3|8)).toString(16)})}
function blank(){return{name:"",phone:"",loc:"",att:"",food:""}}
const S={step:"home",status:null,friends:false,n:1,people:[blank()],file:null,sid:uuid(),errs:[],payErr:"",busy:false,result:null,
  tk:{data:{},search:null,q:"",msg:"",busy:false},cur:null,cv:[],pay:null,payLoading:false,payFail:false,payChanged:false};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const price=()=>S.status?S.status.price_per_head:0;
const total=()=>S.n*price();
const maxN=()=>S.status?S.status.max_group:1;
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const lastCode=()=>{try{return(JSON.parse(localStorage.getItem("mm_last")||"null")||{}).code||""}catch(_){return""}};
const getMine=()=>LS.get("mm_mine",[]);
function remember(key,code,max){const l=LS.get(key,[]).filter(c=>c!==code);l.unshift(code);LS.set(key,l.slice(0,max))}
const normCode=t=>String(t||"").toUpperCase().replace(/O/g,"0").replace(/[\s-]/g,"");
function setN(n){S.n=n;while(S.people.length<n)S.people.push(blank());S.people.length=n}
function opt(i,k,v,cur){return `<label><input type="radio" name="p${i}_${k}" data-i="${i}" data-k="${k}" value="${v}" ${cur===v?"checked":""}><span>${v}</span></label>`}
/* ===== event date, time and venue: set by admins in Admin > Settings. CONFIG values are the backup if it can't be loaded ===== */
let evAt=0;
async function loadEvent(){
  if(!db||Date.now()-evAt<30000)return;
  try{const r=await Promise.race([db.rpc("get_event_info"),new Promise(res=>setTimeout(()=>res(null),2500))]);
    if(r&&r.data&&r.data.event_at&&r.data.venue){S.ev=r.data;evAt=Date.now()}}catch(_){}
}
function evParts(o){try{if(!S.ev)return null;const p={};new Intl.DateTimeFormat("en-GB",{...o,timeZone:"Asia/Kolkata"}).formatToParts(new Date(S.ev.event_at)).forEach(x=>p[x.type]=x.value);return p.year?p:null}catch(_){return null}}
function evDate(){const p=evParts({weekday:"long",day:"numeric",month:"long",year:"numeric"});return p?p.weekday+", "+p.day+" "+p.month+" "+p.year:CONFIG.ticketDate}
function evTime(){try{const t=S.ev&&fmtT(S.ev.event_at);if(t)return t}catch(_){}return CONFIG.ticketTime}
function evVenue(){return(S.ev&&S.ev.venue)||CONFIG.ticketVenue}
function evLine(){const p=evParts({weekday:"short",day:"numeric",month:"short",year:"numeric"});return p?p.weekday+" "+p.day+" "+p.month+" "+p.year+", "+evTime()+" · "+evVenue():CONFIG.eventLine}
function head(t,s){return `<h1>${t}</h1><p class="sub">${s}</p>`}
function closeDate(){try{return new Date(S.status.deadline).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Kolkata"})}catch(_){return""}}
/* payment details (UPI ID, payee name) and the organisers' WhatsApp number come from the database (Admin > Settings) */
function payFrom(d){d=d||{};return{upi:String(d.upi_id||""),payee:String(d.payee_name||""),wa:String(d.whatsapp||"")}}
async function loadPay(){if(!db)return false;try{const{data,error}=await db.rpc("get_payment_info");if(error)throw error;S.pay=payFrom(data);return true}catch(_){return false}}
function waLink(text){return S.pay&&S.pay.wa?"https://wa.me/"+S.pay.wa+"?text="+encodeURIComponent(text):""}
function contactBtn(text,label){const l=waLink(text);return l?`<a class="btn ghost" href="${esc(l)}" target="_blank" rel="noopener">${label||"Contact the organisers"}</a>`:""}

async function load(){
  await loadEvent();
  if(!S.pay)await loadPay();
  try{
    if(!db)throw new Error("no client");
    const{data,error}=await db.rpc("get_public_status",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until)S.step="closed";
    else{if(S.step==="loading"||S.step==="closed"||S.step==="error")S.step="form";
      if(S.n>maxN()){setN(maxN());S.friends=S.n>1}}
  }catch(_){S.step="error"}
  render();
  if(S.step==="form")beat();
}

/* ===== daily pause + 10-minute grace ===== */
let skew=0,expAt=0;
const inFill=()=>["form","summary","pay"].includes(S.step);
function applyStatus(d){S.status=d;if(d&&d.server_now)skew=new Date(d.server_now).getTime()-Date.now()}
const IST={timeZone:"Asia/Kolkata"};
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true,...IST}).toUpperCase()}catch(_){return""}}
function fmtWhen(iso){try{const d=new Date(iso),day=x=>x.toLocaleDateString("en-IN",{day:"numeric",month:"short",...IST});
  return fmtT(iso)+(day(d)===day(new Date(Date.now()+skew))?"":" on "+day(d))}catch(_){return""}}
function graceMs(){return S.status&&S.status.grace_until?new Date(S.status.grace_until).getTime()-(Date.now()+skew):null}
async function beat(){
  if(!db||!inFill())return;
  try{
    const{data,error}=await db.rpc("registration_heartbeat",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until&&inFill()&&!S.busy){S.graceLost=true;S.step="closed";render()}
  }catch(_){}
  paintBar();
  checkPay();
}
function paintBar(){
  const el=$("#gbar");if(!el)return;
  const ms=graceMs();
  if(ms!=null&&ms>0&&inFill()){
    const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;
    el.textContent=(S.status.closed_reason==="deadline"?"The registration deadline has passed, but you have ":"Registration has paused, but you have ")+m+":"+String(s).padStart(2,"0")+" left to finish your booking. Please pay, upload the screenshot and submit."+(S.status.reopen_at?" If you think your registration will take more than 10 minutes, please continue after "+fmtWhen(S.status.reopen_at)+" (when registration reopens).":"");
    el.hidden=false;
  }else{
    el.hidden=true;
    if(ms!=null&&ms<=0&&inFill()&&!S.busy&&Date.now()-expAt>5000){expAt=Date.now();beat()}
  }
}
setInterval(beat,30000);setInterval(paintBar,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)beat()});
/* ===== payment details: always fresh when the Pay step opens, and re-checked every 30 seconds while it is open ===== */
async function goPay(){
  S.step="pay";S.payErr="";S.payFail=false;S.payChanged=false;S.payLoading=true;render();
  const ok=await loadPay();
  S.payLoading=false;S.payFail=!ok;
  if(S.step==="pay")render();
}
async function checkPay(){
  if(S.step!=="pay"||S.busy||S.payLoading||S.payFail||!db)return;
  try{
    const{data,error}=await db.rpc("get_payment_info");if(error)throw error;
    const p=payFrom(data);if(S.step!=="pay"||S.busy)return;
    const changed=p.upi!==(S.pay&&S.pay.upi)||p.payee!==(S.pay&&S.pay.payee);
    S.pay=p;
    if(changed){S.payChanged=true;const y=window.scrollY;render();window.scrollTo(0,y)}
  }catch(_){}
}
/* tapping the QR opens the UPI app on a phone. If nothing opens, say what to do instead. */
let qrT=0;
function qrWait(){clearTimeout(qrT);qrT=setTimeout(()=>{if(!document.hidden)toast("Nothing opened? Scan the QR from another phone, or copy the UPI ID below.",5000)},2500)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)clearTimeout(qrT)});
function stepBar(){const i=({form:1,summary:2,pay:3})[S.step];if(!i)return"";
  return `<ol class="steps" aria-label="Progress">`+["Details","Review","Payment"].map((n,j)=>`<li class="${j+1<i?"done":j+1===i?"cur":""}"${j+1===i?' aria-current="step"':""}><i>${j+1<i?"✓":j+1}</i><span>${n}</span></li>`).join("")+`</ol>`}
function foot(){return S.step==="home"?"":`<p class="foot">${esc(CONFIG.organiserName)}</p>`}
function render(){
  const a=$("#app");
  a.innerHTML=stepBar()+({home:vHome,loading:()=>head("Loading…","One moment."),error:vError,closed:vClosed,form:vForm,summary:vSummary,pay:vPay,done:vDone,tickets:vTickets,ticket:vTicket})[S.step]()+foot();
  if(S.step==="pay"&&$("#qr"))drawQR($("#qr"),upiLink());
  if(S.step==="ticket")drawTickets().catch(()=>{});
  window.scrollTo(0,0);
}
function vHome(){
  const n=getMine().length;
  return `<section class="invite"><div class="band"></div><div class="inner">
  <p class="pres">${esc(CONFIG.organiserName)} presents</p>
  <h1>${esc(CONFIG.eventName)}</h1>
  <div class="orn"><i></i><b></b><i></i></div>
  <dl class="when"><div><dt>Date</dt><dd>${esc(evDate())}</dd></div><div><dt>Time</dt><dd>${esc(evTime())}</dd></div><div><dt>Venue</dt><dd>${esc(evVenue())}</dd></div></dl>
  </div><div class="band"></div></section>
  <div class="row col" style="gap:12px"><button class="big" id="go-register">Register for the meet-up</button>
  <button class="big ghost" id="go-tickets">Tickets</button></div>`+
  (n?`<p class="note" style="text-align:center;margin-top:18px">You have ${n} booking${n===1?"":"s"} on this device. Open Tickets to see ${n===1?"it":"them"}.</p>`:"");
}
function vError(){return head("Couldn't load registration","Please check your internet connection and try again.")+`<div class="row"><button id="retry">Try again</button><button class="ghost" id="go-home">Home</button></div>`}
function vClosed(){
  const st=S.status||{},r=st.closed_reason,re=st.reopen_at?fmtWhen(st.reopen_at):"";
  const m={not_open:["Registrations haven't opened yet","Please check back soon."],

function jpegBlob(c){const e=document.createElement("canvas");e.width=c.width;e.height=c.height;const x=e.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,e.width,e.height);x.drawImage(c,0,0);

function makePDF(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;

  imgs.forEach((im,i)=>{const W=im.w/2,H=im.h/2,p=3+3*i;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;obj(p+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[p+2]=len;push(`${p+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push("\nendstream\nendobj\n")});
  const total=3+3*imgs.length,xr=len;push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function pdfOf(idx){const out=[];for(const i of idx){const c=S.cv[i],b=await jpegBlob(c);out.push({w:c.width,h:c.height,bytes:new Uint8Array(await b.arrayBuffer())})}return makePDF(out)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function downloadTicket(kind,i){
  const t=S.cur.tickets[i];if(!S.cv[i])return toast("Ticket is still loading, try again");
  if(kind==="jpg")saveBlob(await jpegBlob(S.cv[i]),fname(t)+".jpg");else saveBlob(await pdfOf([i]),fname(t)+".pdf");
}
async function downloadAll(kind){
  const r=S.cur,idx=r.tickets.map((_,i)=>i);if(idx.some(i=>!S.cv[i]))return toast("Tickets are still loading, try again");
  if(kind==="pdf")saveBlob(await pdfOf(idx),"Ehsaas26-"+(r.tickets[0].label||"tickets")+"-tickets.pdf");
  else for(const i of idx){saveBlob(await jpegBlob(S.cv[i]),fname(r.tickets[i])+".jpg");await sleep(500)}
}

function drawQR(c,text){
  const q=qrcode(0,"M");q.addData(text);q.make();const m=q.getModuleCount(),k=8,pad=4*k;
  c.width=c.height=m*k+pad*2;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
  for(let r=0;r<m;r++)for(let col=0;col<m;col++)if(q.isDark(r,col))x.fillRect(pad+col*k,pad+r*k,k,k);
}
function toast(t,ms){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200)}
const blobQR=()=>new Promise(r=>$("#qr").toBlob(r,"image/png"));
async function download(){const b=await blobQR(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meetup-upi-"+total()+".png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function compress(file){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{try{const k=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size?b:file)},"image/jpeg",.8)}catch(_){res(file)}};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

async function submit(){
  if(S.busy)return;
  if(!S.file){$("#ferr").textContent="Upload your payment screenshot to continue.";return}
  S.busy=true;S.payErr="";const btn=$("#submit");btn.disabled=true;btn.textContent="Submitting…";
  try{
    const blob=await compress(S.file);
    const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[blob.type];
    if(!ext)S.payErr="Please upload the screenshot as a JPG or PNG image.";
    else{
      const path=S.sid+"."+ext;
      const up=await db.storage.from("payment-proofs").upload(path,blob,{contentType:blob.type,upsert:false});
      if(up.error&&!/exist|duplicate|409/i.test((up.error.message||"")+(up.error.statusCode||"")))throw up.error;
      const{data,error}=await db.rpc("submit_booking",{p_submission_id:S.sid,
        p_people:S.people.map(p=>({name:p.name.trim(),phone:p.phone,loc:p.loc,att:p.att,food:p.food})),p_screenshot_path:path});
      if(error)throw error;
      S.result=data;S.step="done";
      try{localStorage.setItem("mm_last",JSON.stringify({code:data.booking_code}))}catch(_){}
      remember("mm_mine",data.booking_code,20);
    }
  }catch(e){
    const m=(e&&e.message)||String(e);
    if(/NOT_ENOUGH_SPOTS|REGISTRATION_CLOSED/.test(m)){
      S.busy=false;S.graceLost=/REGISTRATION_CLOSED/.test(m);S.step="loading";await load();
      if(S.step==="form")S.errs=["Spots ran out while you were registering. Please reduce the number of people, or try again later."];
      render();return}
    else if(/INVALID_/.test(m)){S.step="form";S.errs=["Some details were not accepted ("+(m.match(/INVALID_\w+/)||[""])[0]+"). Please check each field."]}
    else if(/SCREENSHOT_MISSING/.test(m))S.payErr="The screenshot did not upload. Please select it again and submit.";
    else S.payErr="Could not reach the server. Check your internet and tap Submit again. Tapping again will not create a duplicate booking. (Technical detail: "+m.slice(0,140)+")"
  }finally{S.busy=false}
  render();
}

document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="bq")S.tk.q=t.value;
  if(t.dataset.k==="phone")t.value=t.value.replace(/\D/g,"").slice(0,10);
  if(t.dataset.k)S.people[+t.dataset.i][t.dataset.k]=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="bq"){e.preventDefault();doSearch(e.target.value)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="fr"){S.friends=t.checked;setN(t.checked?2:1);render()}
  else if(t.name==="cnt"){setN(+t.value);render()}
  else if(t.id==="shot"){const f=t.files[0];
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){$("#ferr").textContent="Choose an image file (a screenshot or photo).";t.value="";S.file=null}else{S.file=f||null;S.payErr="";render()}}});
document.addEventListener("click",async e=>{const el=e.target.closest("button,a"),id=el?el.id:"",ds=el?el.dataset:{};
  if(id==="go-home"){S.step="home";render()}
  if(id==="go-register"){S.step="loading";render();load()}
  if(id==="go-tickets")openTickets();
  if(id==="back-tickets"){S.step="tickets";render();loadMine()}
  if(id==="tsearch")doSearch(($("#bq")||{}).value||"");
  if(id==="trefresh"){S.tk.msg="";await loadMine();toast("Status refreshed")}
  if(ds.hist){S.tk.q=ds.hist;doSearch(ds.hist)}
  if(ds.view){const d=S.tk.data[ds.view];if(d&&d.status==="paid"){S.cur=d;S.step="ticket";render()}}
  if(ds.dl)downloadTicket(ds.dl,+ds.i);
  if(id==="dl-all-pdf")downloadAll("pdf");
  if(id==="dl-all-jpg")downloadAll("jpg");
  if(id==="retry"||id==="recheck"){S.graceLost=false;S.step="loading";render();load()}
  if(id==="review"){S.errs=validate();if(S.errs.length)render();else{S.step="summary";render()}}
  if(id==="edit"){S.step="form";S.errs=[];render()}
  if(id==="topay")goPay();
  if(id==="payretry")goPay();
  if(id==="qrlink")qrWait();
  if(id==="back"&&!S.busy){S.step="summary";render()}
  if(id==="copy"){try{await navigator.clipboard.writeText(S.pay.upi);toast("UPI ID copied")}catch(_){toast("Press and hold the UPI ID to copy")}}
  if(id==="copyid"){try{await navigator.clipboard.writeText(S.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(id==="dl")download();
  if(id==="share"){const b=await blobQR(),f=new File([b],"meetup-upi-"+total()+".png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Pay ₹"+total()})}catch(_){}}
    else{await download();toast("Sharing isn't supported here, so the QR was downloaded")}}
  if(id==="submit")submit();
  if(id==="again"){S.sid=uuid();S.graceLost=false;S.people=[blank()];S.n=1;S.friends=false;S.file=null;S.result=null;S.errs=[];S.step="loading";render();load()}
});
render();loadEvent().then(()=>{if(S.step==="home")render()});
loadPay().then(()=>{if(["home","closed","done"].includes(S.step))render()});
</script></body></html>
