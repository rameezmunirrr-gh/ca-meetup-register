<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ehsaas'26 – Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#10231b;--mute:#52665c;--green:#0e5a43;--gold:#c9962b;--line:#cfdcd3;--err:#b3261e;--ok:#17803d;--warn:#a96b00;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a14;--card:#14271e;--ink:#e8f1ec;--mute:#9db3a8;--green:#3fb98d;--gold:#e0b04a;--line:#27402f;--err:#ff8a80;--ok:#6fd39a;--warn:#ffc15a;--on:#06150e}}
:root[data-theme="dark"]{--bg:#0d1a14;--card:#14271e;--ink:#e8f1ec;--mute:#9db3a8;--green:#3fb98d;--gold:#e0b04a;--line:#27402f;--err:#ff8a80;--ok:#6fd39a;--warn:#ffc15a;--on:#06150e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.kasavu{height:10px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,var(--bg) 18px 22px,var(--green) 22px 40px,var(--bg) 40px 44px)}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:2rem;line-height:1.1;font-weight:800;margin:18px 0 6px}
h2{font-size:1.25rem;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
label,.lbl{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=tel],input[type=file]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts label{margin:0;font-weight:400}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:10px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--bg)}
.opts input:checked+span{background:var(--green);color:var(--on);border-color:var(--green)}
.opts input:focus-visible+span,button:focus-visible,input:focus-visible,a.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button,a.btn{font:inherit;font-weight:600;border-radius:10px;padding:13px 18px;border:1px solid var(--green);background:var(--green);color:var(--on);cursor:pointer;display:inline-block;text-align:center;text-decoration:none}
button.ghost,a.btn.ghost{background:transparent;color:var(--green)}
button.big{padding:20px 18px;font-size:1.15rem}
button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row>button,.row>a.btn{flex:1 1 140px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{width:48px;height:28px;accent-color:var(--green)}
.err{color:var(--err);font-size:.92rem;margin:6px 0 0}
.errbox{border-color:var(--err);color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto}
.amt{font-size:2.6rem;font-weight:800;line-height:1}
.qr{display:block;margin:14px auto;width:min(260px,100%);height:auto;border-radius:8px;border:6px solid #fff;background:#fff}
.upi{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.upi code{padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:9}
.note{font-size:.9rem;color:var(--mute)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;font-weight:600;white-space:nowrap}
.p-ok{color:var(--ok);border-color:var(--ok)}.p-wait{color:var(--warn);border-color:var(--warn)}.p-bad{color:var(--err);border-color:var(--err)}
ul.names{margin:10px 0 0;padding-left:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button.chip{padding:8px 12px;border-radius:999px;background:var(--bg);color:var(--ink);border:1px solid var(--line);letter-spacing:.06em;font-weight:600}
canvas.tk{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
</style></head>
<body>
<div class="kasavu"></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG: change these in one place ===== */
const CONFIG={
  eventName:"Ehsaas'26",
  eventLine:"Sun 22 Nov 2026, 2 PM · Savoury Business Hotel, Madiwala",
  ticketDate:"Sunday, 22 November 2026",          // shown on the ticket
  ticketTime:"2:00 PM",                            // shown on the ticket
  ticketVenue:"Savoury Business Hotel, Madiwala",  // shown on the ticket
  organiserName:"Mallu Articles Bengaluru",        // shown on the ticket
  ticketTagline:"MALAYALEE CA MEETUP · BENGALURU", // small line at the top of the ticket
  organiserWhatsApp:"916235202168",                // TEST NUMBER: country code + digits, no + or spaces. Swap before launch.
  upiId:"mramizmuneer@okhdfcbank",
  payeeName:"Ramiz Muneer",
  supabaseUrl:"https://jddrwajazpsdrqpwlncu.supabase.co",
  supabaseKey:"sb_publishable_W3tJTLdbCOuwkUwkjLW1Iw_9m1zGHFT"   // publishable key: safe to be public
};
const PLACEHOLDER_UPI=CONFIG.upiId==="yourname@upi";
let db=null;try{db=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false}})}catch(_){}

function uuid(){if(crypto.randomUUID)return crypto.randomUUID();
  return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==="x"?r:(r&3|8)).toString(16)})}
function blank(){return{name:"",phone:"",loc:"",att:"",food:""}}
const S={step:"home",status:null,friends:false,n:1,people:[blank()],file:null,sid:uuid(),errs:[],payErr:"",busy:false,result:null,
  tk:{data:{},search:null,q:"",msg:"",busy:false},cur:null,cv:[]};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const price=()=>S.status?S.status.price_per_head:0;
const total=()=>S.n*price();
const maxN=()=>S.status?S.status.max_group:1;
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const lastCode=()=>{try{return(JSON.parse(localStorage.getItem("mm_last")||"null")||{}).code||""}catch(_){return""}};
const getMine=()=>LS.get("mm_mine",[]);
function remember(key,code,max){const l=LS.get(key,[]).filter(c=>c!==code);l.unshift(code);LS.set(key,l.slice(0,max))}
const normCode=t=>String(t||"").toUpperCase().replace(/O/g,"0").replace(/[\s-]/g,"");
function setN(n){S.n=n;while(S.people.length<n)S.people.push(blank());S.people.length=n}
function opt(i,k,v,cur){return `<label><input type="radio" name="p${i}_${k}" data-i="${i}" data-k="${k}" value="${v}" ${cur===v?"checked":""}><span>${v}</span></label>`}
function head(t,s){return `<h1>${t}</h1><p class="sub">${s}</p>`}
function closeDate(){try{return new Date(S.status.deadline).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Kolkata"})}catch(_){return""}}
function waLink(text){return "https://wa.me/"+CONFIG.organiserWhatsApp+"?text="+encodeURIComponent(text)}
function contactBtn(text,label){return `<a class="btn ghost" href="${esc(waLink(text))}" target="_blank" rel="noopener">${label||"Contact the organisers"}</a>`}

async function load(){
  try{
    if(!db)throw new Error("no client");
    const{data,error}=await db.rpc("get_public_status");if(error)throw error;
    S.status=data;
    if(!data.accepting)S.step="closed";
    else{if(S.step==="loading"||S.step==="closed"||S.step==="error")S.step="form";
      if(S.n>maxN()){setN(maxN());S.friends=S.n>1}}
  }catch(_){S.step="error"}
  render();
}
function render(){
  const a=$("#app");
  a.innerHTML=({home:vHome,loading:()=>head("Loading…","One moment."),error:vError,closed:vClosed,form:vForm,summary:vSummary,pay:vPay,done:vDone,tickets:vTickets,ticket:vTicket})[S.step]();
  if(S.step==="pay")drawQR($("#qr"),upiLink());
  if(S.step==="ticket")drawTickets().catch(()=>{});
  window.scrollTo(0,0);
}
function vHome(){
  const n=getMine().length;
  return head(esc(CONFIG.eventName),esc(CONFIG.eventLine))+
  `<div class="row" style="flex-direction:column"><button class="big" id="go-register">Register for the meet-up</button>
  <button class="big ghost" id="go-tickets">Tickets</button></div>`+
  (n?`<p class="note">You have ${n} booking${n===1?"":"s"} on this device. Open Tickets to see ${n===1?"it":"them"}.</p>`:"");
}
function vError(){return head("Couldn't load registration","Please check your internet connection and try again.")+`<div class="row"><button id="retry">Try again</button><button class="ghost" id="go-home">Home</button></div>`}
function vClosed(){
  const r=S.status&&S.status.closed_reason;
  const m={not_open:["Registrations haven't opened yet","Please check back soon."],deadline:["Registrations are closed","The registration deadline has passed."],full:["All spots are taken","Registrations are full. Please contact the organisers if you need help."]}[r]||["Registrations are closed",""];
  return head(m[0],esc(CONFIG.eventName)+". "+m[1])+`<div class="row"><button class="ghost" id="retry">Check again</button><button class="ghost" id="go-home">Home</button></div>`;
}
function vForm(){
  const st=S.status;
  let h=head(esc(CONFIG.eventName),esc(CONFIG.eventLine)+". Registration is ₹"+st.price_per_head+" per person"+(closeDate()?", open until "+closeDate():"")+".");
  if(st.spots_left<=20)h+=`<div class="card"><b>Only ${st.spots_left} spot${st.spots_left===1?"":"s"} left</b></div>`;
  if(lastCode())h+=`<div class="card note">You already made a booking from this device (Booking ID <b>${esc(lastCode())}</b>). Submitting again creates a new booking.</div>`;
  if(S.errs.length)h+=`<div class="card errbox" role="alert"><b>Please fix:</b><ul>${S.errs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
  if(maxN()>1){
    h+=`<div class="card"><div class="sw"><div><b>Include friends</b><div class="note">Register up to ${maxN()} people in one booking</div></div><input type="checkbox" id="fr" ${S.friends?"checked":""} aria-label="Include friends"></div>`;
    if(S.friends)h+=`<div class="lbl">How many people are you registering for?</div><div class="opts">`+
      Array.from({length:maxN()-1},(_,j)=>j+2).map(n=>`<label><input type="radio" name="cnt" value="${n}" ${S.n===n?"checked":""}><span>${n}</span></label>`).join("")+`</div>`;
    h+=`</div>`;
  }
  S.people.forEach((p,i)=>{
    h+=`<div class="card"><h2>${S.n>1?"Person "+(i+1):"Your details"}</h2>
    <label for="n${i}">Name</label><input type="text" id="n${i}" data-i="${i}" data-k="name" value="${esc(p.name)}" maxlength="80" autocomplete="${i?"off":"name"}">
    <label for="t${i}">Phone number</label><input type="tel" id="t${i}" data-i="${i}" data-k="phone" value="${esc(p.phone)}" inputmode="numeric" maxlength="10" placeholder="10 digits" autocomplete="${i?"off":"tel-national"}">
    <div class="lbl">Where are you currently?</div><div class="opts">${opt(i,"loc","In Bengaluru",p.loc)}${opt(i,"loc","Outside Bengaluru",p.loc)}</div>
    <div class="lbl">Will you attend?</div><div class="opts">${opt(i,"att","Surely",p.att)}${opt(i,"att","Most probably",p.att)}</div>
    <div class="lbl">Food preference</div><div class="opts">${opt(i,"food","Veg",p.food)}${opt(i,"food","Non-veg",p.food)}</div></div>`;
  });
  return h+`<div class="row"><button class="ghost" id="go-home">Home</button><button id="review">Review details</button></div>`;
}
function validate(){
  const e=[];S.people.forEach((p,i)=>{const w=S.n>1?"Person "+(i+1)+": ":"";
    if(!p.name.trim())e.push(w+"enter a name");
    if(!/^\d{10}$/.test(p.phone))e.push(w+"phone must be exactly 10 digits");
    if(!p.loc)e.push(w+"choose where you are currently");
    if(!p.att)e.push(w+"choose Surely or Most probably");
    if(!p.food)e.push(w+"choose Veg or Non-veg")});
  return e;
}
function vSummary(){
  return head("Check your details","Make sure everything is right. Food and hall numbers are planned from this.")+
  `<div class="card wrap"><table><tr><th></th><th>Name</th><th>Phone</th><th>Location</th><th>Attending</th><th>Food</th></tr>`+
  S.people.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name.trim())}</td><td>${p.phone}</td><td>${p.loc}</td><td>${p.att}</td><td>${p.food}</td></tr>`).join("")+
  `</table></div><div class="card"><b>${S.n} × ₹${price()} = ₹${total()}</b> payable</div>
  <div class="row"><button class="ghost" id="edit">Edit details</button><button id="topay">Continue to payment</button></div>`;
}
function upiLink(){return `upi://pay?pa=${encodeURIComponent(CONFIG.upiId)}&pn=${encodeURIComponent(CONFIG.payeeName)}&am=${total().toFixed(2)}&cu=INR&tn=${encodeURIComponent("Meetup "+S.n+" reg")}`}
function vPay(){
  return head("Pay ₹"+total(),S.n+" registration"+(S.n>1?"s":"")+" × ₹"+price())+
  (PLACEHOLDER_UPI?`<div class="card errbox" role="alert"><b>Test mode:</b> the UPI ID is still a placeholder. Do not pay.</div>`:"")+
  (S.payErr?`<div class="card errbox" role="alert">${esc(S.payErr)}</div>`:"")+
  `<div class="card" style="text-align:center"><div class="amt">₹${total()}</div><canvas id="qr" class="qr" aria-label="UPI payment QR for ₹${total()}"></canvas>
  <div class="upi"><code id="uid">${esc(CONFIG.upiId)}</code><button class="ghost" id="copy">Copy UPI ID</button></div>
  <div class="row"><button id="share">Share QR</button><button class="ghost" id="dl">Download QR</button></div>
  <p class="note">Share opens your phone's share sheet. Pick Google Pay or any UPI app to pay ₹${total()}.</p></div>
  <div class="card"><label for="shot">Upload payment screenshot</label><input type="file" id="shot" accept="image/*">
  <div class="note">${S.file?"Selected: "+esc(S.file.name):"Required. Images only."}</div><div class="err" id="ferr"></div></div>
  <div class="row"><button class="ghost" id="back" ${S.busy?"disabled":""}>Back</button><button id="submit">Submit registration</button></div>`;
}
function vDone(){
  const r=S.result;
  return head("Registration received","Save your Booking ID. When the organisers confirm your payment, open Tickets on this page to download your tickets.")+
  `<div class="card" style="text-align:center"><div class="note">Booking ID</div><div class="amt" style="letter-spacing:.08em">${esc(r.booking_code)}</div>
  <div class="row"><button class="ghost" id="copyid">Copy Booking ID</button></div></div>
  <div class="card wrap"><table><tr><th>Name</th><th>Food</th></tr>`+
  r.tickets.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.food)}</td></tr>`).join("")+
  `</table></div><div class="card"><span class="pill p-wait">Pending verification</span>
  <p>Amount to be verified: <b>₹${r.amount_expected}</b>. Your ticket numbers are given once the organisers confirm your payment.</p>
  <p class="note">This booking is saved on this device. You can also open it from any other device with the Booking ID.</p></div>
  <div class="row"><button id="go-tickets">Go to Tickets</button>${contactBtn("Hi, I'm checking on my "+CONFIG.eventName+" booking, ID "+r.booking_code+".")}</div>
  <div class="row"><button class="ghost" id="again">Register another booking</button><button class="ghost" id="go-home">Home</button></div>`;
}

/* ---------- Tickets page ---------- */
function bookingCard(code){
  const d=S.tk.data[code];
  if(d==="err")return `<div class="card"><b>${esc(code)}</b><p class="note">Couldn't load this booking. Check your internet and tap Refresh status.</p></div>`;
  if(!d)return `<div class="card"><b>${esc(code)}</b><p class="note">This Booking ID was not found.</p></div>`;
  const names=`<ul class="names">`+d.tickets.map(t=>`<li>${esc(t.name)} <span class="note">· ${esc(t.food)}</span></li>`).join("")+`</ul>`;
  const idl=`<b style="letter-spacing:.08em">${esc(d.booking_code)}</b>`;
  const msg="Hi, I'm checking on my "+CONFIG.eventName+" booking, ID "+d.booking_code+".";
  if(d.status==="paid")return `<div class="card"><div class="sw">${idl}<span class="pill p-ok">Confirmed</span></div>${names}<div class="row"><button data-view="${esc(d.booking_code)}">View Ticket</button></div></div>`;
  if(d.status==="rejected")return `<div class="card"><div class="sw">${idl}<span class="pill p-bad">Not verified</span></div>${names}<p class="err">Payment couldn't be verified. Please contact the organisers.</p><div class="row">${contactBtn(msg)}</div></div>`;
  return `<div class="card"><div class="sw">${idl}<span class="pill p-wait">Pending verification</span></div>${names}<p class="note">We're checking your payment. If it's taking long, contact the organisers.</p><div class="row">${contactBtn(msg)}</div></div>`;
}
function vTickets(){
  const T=S.tk,se=T.search,mine=getMine().filter(c=>!(se&&!se.nf&&se.code===c)),hist=LS.get("mm_hist",[]);
  let h=head("Tickets","Check your booking and download your tickets once the payment is confirmed.");
  h+=`<div class="card"><label for="bq">Booking ID</label><input type="text" id="bq" value="${esc(T.q)}" maxlength="14" autocapitalize="characters" autocomplete="off" placeholder="e.g. 97FB17B2">
  <div class="row"><button id="tsearch" ${T.busy?"disabled":""}>${T.busy?"Searching…":"Search"}</button></div>${T.msg?`<div class="err" role="alert">${esc(T.msg)}</div>`:""}</div>`;
  if(hist.length)h+=`<div class="lbl">Recent searches</div><div class="chips" style="margin-bottom:14px">${hist.map(c=>`<button class="chip" data-hist="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
  if(se){
    h+=se.nf?`<div class="card"><b>No booking found${se.code?" for "+esc(se.code):""}.</b><p class="note">Check the Booking ID. The letter O and the number 0 are treated the same.</p><div class="row">${contactBtn("Hi, I couldn't find my "+CONFIG.eventName+" booking"+(se.code?" (I searched for "+se.code+")":"")+".","Need help?")}</div></div>`:bookingCard(se.code);
  }
  if(mine.length)h+=`<h2 style="margin-top:20px">On this device</h2>`+mine.map(bookingCard).join("");
  h+=`<div class="row"><button class="ghost" id="trefresh">Refresh status</button><button class="ghost" id="go-home">Home</button></div>`;
  return h;
}
async function fetchBooking(code){const{data,error}=await db.rpc("lookup_booking",{p_code:code});if(error)throw error;return data}
async function loadMine(){
  const codes=getMine();if(!codes.length)return;
  await Promise.all(codes.map(async c=>{try{S.tk.data[c]=await fetchBooking(c)}catch(_){S.tk.data[c]="err"}}));
  if(S.step==="tickets"){const q=($("#bq")||{}).value;if(q!=null)S.tk.q=q;const y=window.scrollY;render();window.scrollTo(0,y)}
}
async function doSearch(raw){
  const code=normCode(raw);S.tk.q=raw;S.tk.msg="";
  if(!/^[0-9A-F]{8}$/.test(code)){S.tk.search={code:String(raw).trim(),nf:true};return render()}
  S.tk.busy=true;render();
  try{
    const d=await fetchBooking(code);S.tk.data[code]=d;
    if(d){remember("mm_hist",code,10);S.tk.search={code,nf:false}}else S.tk.search={code,nf:true};
  }catch(_){S.tk.search=null;S.tk.msg="Could not reach the server. Check your internet and try again."}
  S.tk.busy=false;render();
}
function openTickets(){S.step="tickets";S.tk.search=null;S.tk.msg="";S.tk.q="";render();loadMine()}
function vTicket(){
  const r=S.cur,n=r.tickets.length;
  let h=head("Your ticket"+(n>1?"s":""),"Booking ID <b>"+esc(r.booking_code)+"</b>. Show the QR code at the entry.");
  r.tickets.forEach((t,i)=>{
    h+=`<div class="card"><canvas id="tc${i}" class="tk" width="900" height="1480" role="img" aria-label="Ticket ${esc(t.label||"")} for ${esc(t.name)}"></canvas>
    <div class="row"><button data-dl="jpg" data-i="${i}">Download JPG</button><button class="ghost" data-dl="pdf" data-i="${i}">Download PDF</button></div></div>`;
  });
  if(n>1)h+=`<div class="card"><b>Everyone in this booking</b><div class="row"><button id="dl-all-pdf">All tickets as one PDF</button><button class="ghost" id="dl-all-jpg">All tickets as JPG</button></div><p class="note">The JPG option downloads one image per person. Your browser may ask permission to download several files.</p></div>`;
  return h+`<div class="row"><button class="ghost" id="back-tickets">Back to Tickets</button><button class="ghost" id="go-home">Home</button></div>`;
}

/* ---------- ticket drawing (canvas) ---------- */
const TW=900,TH=1480;
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
const FF='"Bricolage Grotesque",Arial,sans-serif';
function txt(x,s,X,Y,size,wt,col,al,sp){x.font=wt+" "+size+"px "+FF;x.fillStyle=col;x.textAlign=al||"left";x.textBaseline="alphabetic";try{x.letterSpacing=(sp||0)+"px"}catch(_){}x.fillText(s,X,Y);try{x.letterSpacing="0px"}catch(_){}}
function fit(x,s,maxW,size,min,wt){let z=size;for(;z>min;z-=2){x.font=wt+" "+z+"px "+FF;if(x.measureText(s).width<=maxW)break}return z}
function foodMark(x,X,Y,veg){const col=veg?"#1f9d55":"#c62828";x.fillStyle="#fff";rr(x,X,Y,48,48,8);x.fill();x.lineWidth=5;x.strokeStyle=col;rr(x,X+2.5,Y+2.5,43,43,6);x.stroke();x.fillStyle=col;x.beginPath();x.arc(X+24,Y+24,11,0,7);x.fill()}
function drawTicket(c,t,code){
  const coord=t.kind==="coordinator",W=TW,H=TH;
  const P=coord?{a:"#4a0c1a",b:"#7d1c32",gold:"#e2b04a",ink:"#fbf3df",bandInk:"#4a0c1a",mute:"#ecc9c9"}:{a:"#0a3a2b",b:"#0f6048",gold:"#e0b04a",ink:"#f7f0dc",bandInk:"#0a3a2b",mute:"#bfe0d1"};
  c.width=W;c.height=H;const x=c.getContext("2d");x.clearRect(0,0,W,H);
  x.save();rr(x,0,0,W,H,52);x.clip();
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,P.a);g.addColorStop(1,P.b);x.fillStyle=g;x.fillRect(0,0,W,H);
  // kasavu edge + band
  for(let i=0;i<W;i+=40){x.fillStyle=P.gold;x.fillRect(i,0,34,16);x.fillStyle=P.ink;x.fillRect(i+34,0,6,16)}
  x.fillStyle=P.gold;x.fillRect(0,16,W,92);
  txt(x,coord?"COORDINATOR":"ADMIT ONE",W/2,80,46,"800",P.bandInk,"center",12);
  // header
  txt(x,CONFIG.ticketTagline,W/2,190,26,"600",P.gold,"center",4);
  const ts=fit(x,CONFIG.eventName,780,170,60,"800");txt(x,CONFIG.eventName,W/2,330,ts,"800",P.ink,"center",0);
  txt(x,CONFIG.organiserName,W/2,392,30,"400",P.mute,"center",1);
  x.fillStyle=P.gold;x.fillRect(W/2-60,430,120,4);
  // details
  [["DATE",CONFIG.ticketDate],["TIME",CONFIG.ticketTime],["VENUE",CONFIG.ticketVenue]].forEach((r,i)=>{
    const y=500+i*118;txt(x,r[0],70,y,24,"600",P.gold,"left",6);
    const sz=fit(x,r[1],760,42,26,"600");txt(x,r[1],70,y+54,sz,"600",P.ink,"left",0)});
  // attendee
  txt(x,"ATTENDEE",70,884,24,"600",P.gold,"left",6);
  const ns=fit(x,t.name,760,74,34,"800");txt(x,t.name,70,962,ns,"800",P.ink,"left",0);
  const veg=t.food==="Veg";foodMark(x,70,994,veg);txt(x,veg?"Veg":"Non-veg",134,1032,34,"600",P.ink,"left",0);
  // perforation
  x.setLineDash([14,12]);x.strokeStyle=P.gold;x.globalAlpha=.7;x.lineWidth=3;x.beginPath();x.moveTo(60,1100);x.lineTo(W-60,1100);x.stroke();x.setLineDash([]);x.globalAlpha=1;
  x.globalCompositeOperation="destination-out";x.beginPath();x.arc(0,1100,34,0,7);x.fill();x.beginPath();x.arc(W,1100,34,0,7);x.fill();x.globalCompositeOperation="source-over";
  // stub
  txt(x,"TICKET NO.",70,1180,24,"600",P.gold,"left",6);
  const lab=t.label||"—",ls=fit(x,lab,440,88,40,"800");txt(x,lab,70,1266,ls,"800",P.ink,"left",0);
  txt(x,"BOOKING ID",70,1336,24,"600",P.gold,"left",6);
  txt(x,code,70,1384,40,"600",P.ink,"left",6);
  txt(x,"Show this QR at the entry",70,1434,24,"400",P.mute,"left",0);
  // QR
  x.fillStyle="#fff";rr(x,550,1150,280,280,24);x.fill();
  if(t.secret&&t.label){
    const q=qrcode(0,"M");q.addData(t.label+"|"+t.secret);q.make();const m=q.getModuleCount(),k=Math.floor(240/m),o=550+(280-m*k)/2,p=1150+(280-m*k)/2;
    x.fillStyle="#000";for(let r=0;r<m;r++)for(let cc=0;cc<m;cc++)if(q.isDark(r,cc))x.fillRect(o+cc*k,p+r*k,k,k);
  }else txt(x,"Not ready",690,1296,30,"600","#444","center",0);
  x.restore();
}
async function drawTickets(){
  const r=S.cur;S.cv=[];
  try{if(document.fonts&&document.fonts.load)await Promise.all(['800 60px','600 30px','400 30px'].map(f=>document.fonts.load(f+' "Bricolage Grotesque"')))}catch(_){}
  r.tickets.forEach((t,i)=>{const c=document.getElementById("tc"+i);if(c){drawTicket(c,t,r.booking_code);S.cv[i]=c}});
}

/* ---------- downloads (JPG / PDF) ---------- */
function slug(s){return(String(s).replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30))||"ticket"}
function fname(t){return "Ehsaas26-"+(t.label||"ticket")+"-"+slug(t.name)}
function jpegBlob(c){const e=document.createElement("canvas");e.width=c.width;e.height=c.height;const x=e.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,e.width,e.height);x.drawImage(c,0,0);
  return new Promise(r=>e.toBlob(r,"image/jpeg",.95))}
function saveBlob(b,name){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function makePDF(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=v=>{const b=typeof v==="string"?enc.encode(v):v;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;push(id+" 0 obj\n"+body+"\nendobj\n")};
  push("%PDF-1.4\n");push(new Uint8Array([37,226,227,207,211,10]));
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+imgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] /Count "+imgs.length+" >>");
  imgs.forEach((im,i)=>{const W=im.w/2,H=im.h/2,p=3+3*i;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;obj(p+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[p+2]=len;push(`${p+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push("\nendstream\nendobj\n")});
  const total=3+3*imgs.length,xr=len;push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function pdfOf(idx){const out=[];for(const i of idx){const c=S.cv[i],b=await jpegBlob(c);out.push({w:c.width,h:c.height,bytes:new Uint8Array(await b.arrayBuffer())})}return makePDF(out)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function downloadTicket(kind,i){
  const t=S.cur.tickets[i];if(!S.cv[i])return toast("Ticket is still loading, try again");
  if(kind==="jpg")saveBlob(await jpegBlob(S.cv[i]),fname(t)+".jpg");else saveBlob(await pdfOf([i]),fname(t)+".pdf");
}
async function downloadAll(kind){
  const r=S.cur,idx=r.tickets.map((_,i)=>i);if(idx.some(i=>!S.cv[i]))return toast("Tickets are still loading, try again");
  if(kind==="pdf")saveBlob(await pdfOf(idx),"Ehsaas26-"+r.booking_code+"-tickets.pdf");
  else for(const i of idx){saveBlob(await jpegBlob(S.cv[i]),fname(r.tickets[i])+".jpg");await sleep(500)}
}

function drawQR(c,text){
  const q=qrcode(0,"M");q.addData(text);q.make();const m=q.getModuleCount(),k=8,pad=4*k;
  c.width=c.height=m*k+pad*2;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
  for(let r=0;r<m;r++)for(let col=0;col<m;col++)if(q.isDark(r,col))x.fillRect(pad+col*k,pad+r*k,k,k);
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const blobQR=()=>new Promise(r=>$("#qr").toBlob(r,"image/png"));
async function download(){const b=await blobQR(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meetup-upi-"+total()+".png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function compress(file){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{try{const k=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size?b:file)},"image/jpeg",.8)}catch(_){res(file)}};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

async function submit(){
  if(S.busy)return;
  if(!S.file){$("#ferr").textContent="Upload your payment screenshot to continue.";return}
  S.busy=true;S.payErr="";const btn=$("#submit");btn.disabled=true;btn.textContent="Submitting…";
  try{
    const blob=await compress(S.file);
    const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[blob.type];
    if(!ext)S.payErr="Please upload the screenshot as a JPG or PNG image.";
    else{
      const path=S.sid+"."+ext;
      const up=await db.storage.from("payment-proofs").upload(path,blob,{contentType:blob.type,upsert:false});
      if(up.error&&!/exist|duplicate|409/i.test((up.error.message||"")+(up.error.statusCode||"")))throw up.error;
      const{data,error}=await db.rpc("submit_booking",{p_submission_id:S.sid,
        p_people:S.people.map(p=>({name:p.name.trim(),phone:p.phone,loc:p.loc,att:p.att,food:p.food})),p_screenshot_path:path});
      if(error)throw error;
      S.result=data;S.step="done";
      try{localStorage.setItem("mm_last",JSON.stringify({code:data.booking_code}))}catch(_){}
      remember("mm_mine",data.booking_code,20);
    }
  }catch(e){
    const m=(e&&e.message)||String(e);
    if(/NOT_ENOUGH_SPOTS|REGISTRATION_CLOSED/.test(m)){
      S.busy=false;S.step="loading";await load();
      if(S.step==="form")S.errs=["Spots ran out while you were registering. Please reduce the number of people, or try again later."];
      render();return}
    else if(/INVALID_/.test(m)){S.step="form";S.errs=["Some details were not accepted ("+(m.match(/INVALID_\w+/)||[""])[0]+"). Please check each field."]}
    else if(/SCREENSHOT_MISSING/.test(m))S.payErr="The screenshot did not upload. Please select it again and submit.";
    else S.payErr="Could not reach the server. Check your internet and tap Submit again. Tapping again will not create a duplicate booking. (Technical detail: "+m.slice(0,140)+")"
  }finally{S.busy=false}
  render();
}

document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="bq")S.tk.q=t.value;
  if(t.dataset.k==="phone")t.value=t.value.replace(/\D/g,"").slice(0,10);
  if(t.dataset.k)S.people[+t.dataset.i][t.dataset.k]=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="bq"){e.preventDefault();doSearch(e.target.value)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="fr"){S.friends=t.checked;setN(t.checked?2:1);render()}
  else if(t.name==="cnt"){setN(+t.value);render()}
  else if(t.id==="shot"){const f=t.files[0];
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){$("#ferr").textContent="Choose an image file (a screenshot or photo).";t.value="";S.file=null}else{S.file=f||null;S.payErr="";render()}}});
document.addEventListener("click",async e=>{const el=e.target.closest("button,a"),id=el?el.id:"",ds=el?el.dataset:{};
  if(id==="go-home"){S.step="home";render()}
  if(id==="go-register"){S.step="loading";render();load()}
  if(id==="go-tickets")openTickets();
  if(id==="back-tickets"){S.step="tickets";render();loadMine()}
  if(id==="tsearch")doSearch(($("#bq")||{}).value||"");
  if(id==="trefresh"){S.tk.msg="";await loadMine();toast("Status refreshed")}
  if(ds.hist){S.tk.q=ds.hist;doSearch(ds.hist)}
  if(ds.view){const d=S.tk.data[ds.view];if(d&&d.status==="paid"){S.cur=d;S.step="ticket";render()}}
  if(ds.dl)downloadTicket(ds.dl,+ds.i);
  if(id==="dl-all-pdf")downloadAll("pdf");
  if(id==="dl-all-jpg")downloadAll("jpg");
  if(id==="retry"||id==="recheck"){S.step="loading";render();load()}
  if(id==="review"){S.errs=validate();if(S.errs.length)render();else{S.step="summary";render()}}
  if(id==="edit"){S.step="form";S.errs=[];render()}
  if(id==="topay"){S.step="pay";S.payErr="";render()}
  if(id==="back"&&!S.busy){S.step="summary";render()}
  if(id==="copy"){try{await navigator.clipboard.writeText(CONFIG.upiId);toast("UPI ID copied")}catch(_){toast("Press and hold the UPI ID to copy")}}
  if(id==="copyid"){try{await navigator.clipboard.writeText(S.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(id==="dl")download();
  if(id==="share"){const b=await blobQR(),f=new File([b],"meetup-upi-"+total()+".png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Pay ₹"+total()})}catch(_){}}
    else{await download();toast("Sharing isn't supported here, so the QR was downloaded")}}
  if(id==="submit")submit();
  if(id==="again"){S.sid=uuid();S.people=[blank()];S.n=1;S.friends=false;S.file=null;S.result=null;S.errs=[];S.step="loading";render();load()}
});
render();
</script></body></html>
