<style>
:root{--bg:#FBF7EC;--card:#FFFDF7;--ink:#13203B;--mute:#576179;--brand:#0A2147;--brand-d:#061633;--accent:#FFA400;--accent-ink:#8A5200;--line:#E9E1CC;--line2:#D9CDAD;--err:#a8261d;--ok:#17803d;--warn:#9a6200;--on:#FFFDF7;--serif:"Fraunces",Georgia,serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Jost",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums}
.kasavu{height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,var(--bg) 22px 26px,var(--brand) 26px 40px,var(--bg) 40px 44px)}
.top{background:var(--brand);color:var(--on);padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top div{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}.top img{height:30px;width:auto;display:block}.top span{font:600 1.05rem/1.1 var(--serif);letter-spacing:.01em}
body[data-step="home"] .top,body[data-step="home"] .kasavu{display:none}
main{max-width:560px;margin:0 auto;padding:12px 18px 64px}
h1{font:600 clamp(2.3rem,9vw,3rem)/1.04 var(--serif);color:var(--brand);margin:22px 0 8px;letter-spacing:-.01em}
h2{font:600 1.6rem/1.15 var(--serif);color:var(--brand);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 22px;max-width:46ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;margin:0 0 16px;box-shadow:0 14px 32px -22px rgba(10,33,71,.3)}
label,.lbl{display:block;font-weight:500;font-size:.93rem;margin:16px 0 8px}
input[type=text],input[type=tel],input[type=file]{width:100%;font:inherit;padding:14px 16px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#66728A}
input[type=text]:focus,input[type=tel]:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(10,33,71,.12);outline:none}
input[type=file]{border-style:dashed;background:#fffcf3;padding:14px}
input[type=file]::file-selector-button{margin-right:14px;border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:10px;padding:8px 14px;font:500 .95rem "Jost",sans-serif;cursor:pointer}
textarea{width:100%;font:inherit;padding:14px 16px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink);resize:vertical;min-height:96px;transition:border-color .15s,box-shadow .15s}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(10,33,71,.12);outline:none}
.opts.rate span{min-width:46px;text-align:center;padding:11px 0}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opts label{margin:0;font-weight:400;position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;padding:11px 20px;border:1px solid var(--line2);border-radius:999px;cursor:pointer;background:#fff;transition:border-color .15s,background .15s}
.opts span:hover{border-color:var(--accent)}
.opts input:checked+span{background:var(--brand);color:var(--on);border-color:var(--brand);box-shadow:0 6px 14px -8px rgba(10,33,71,.8)}
.opts input:focus-visible+span,button:focus-visible,a.btn:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
button,a.btn{font:500 1rem/1.2 "Jost",system-ui,sans-serif;letter-spacing:.02em;border-radius:12px;padding:15px 22px;border:1px solid var(--brand);background:var(--brand);color:var(--on);cursor:pointer;display:inline-block;text-align:center;text-decoration:none;box-shadow:0 10px 20px -12px rgba(10,33,71,.8);transition:background .15s,border-color .15s}
button:hover,a.btn:hover{background:var(--brand-d)}
button:active{transform:translateY(1px)}
button.ghost,a.btn.ghost{background:transparent;color:var(--brand);box-shadow:none;border-color:var(--line2)}
button.ghost:hover,a.btn.ghost:hover{background:#f4ecd6;border-color:var(--accent)}
button.big{padding:19px 22px;font-size:1.08rem}
button.big:not(.ghost){background:var(--accent);border-color:var(--accent);color:var(--brand-d);font-weight:600;box-shadow:0 12px 24px -14px rgba(255,164,0,.9)}
button.big:not(.ghost):hover{background:#ffb52e}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.row>button,.row>a.btn{flex:1 1 140px}
.row.col{flex-direction:column;margin-top:0}.row.col>button{flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:30px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;margin:0}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked{background:var(--brand)}.sw input:checked:after{transform:translateX(22px)}
.sw input:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
.err{color:var(--err);font-size:.92rem;margin:8px 0 0}
.errbox{border-color:#e3a7a1;background:#fdf1ef;color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{text-align:left;padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;font-weight:500;color:var(--mute)}tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
.amt{font:600 3.2rem/1 var(--serif),"Jost",sans-serif;color:var(--brand)}
.qr{display:block;margin:18px auto;width:min(260px,100%);height:auto;border-radius:14px;border:8px solid #fff;background:#fff;box-shadow:0 0 0 1px var(--line2),0 16px 30px -16px rgba(10,33,71,.4)}
.upi{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.upi code{padding:9px 12px;border:1px dashed var(--line2);border-radius:10px;background:#fffcf3}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand-d);color:var(--on);padding:11px 18px;border-radius:999px;z-index:9;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.note{font-size:.9rem;color:var(--mute)}
[hidden]{display:none!important}
#gbar{position:sticky;top:0;z-index:5;background:#fdf1d0;color:#5a3a00;padding:12px 18px;text-align:center;font-weight:500;font-size:.95rem;border-bottom:1px solid #e6c97a}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;border:1px solid var(--line2);font-size:.85rem;font-weight:500;white-space:nowrap}
.p-ok{color:#0f6a35;background:#e9f5ec;border-color:#bfe0c8}.p-wait{color:#7a4d00;background:#fdf3dc;border-color:#ecd49a}.p-bad{color:var(--err);background:#fcecea;border-color:#f0c2bd}
ul.names{margin:12px 0 0;padding-left:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pf{display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:12px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.pf:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(10,33,71,.12)}
.pf span{display:flex;align-items:center;padding:0 12px 0 16px;background:#f6f0de;color:var(--mute);font-weight:500;border-right:1px solid var(--line2);user-select:none}
.pf input{border:0!important;box-shadow:none!important;border-radius:0!important;flex:1;min-width:0}
input[type=text]:focus-visible,input[type=tel]:focus-visible{outline:none}
button.chip{padding:8px 14px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line2);letter-spacing:.06em;font-weight:500;box-shadow:none}
canvas.tk{display:block;width:100%;height:auto;border-radius:22px;box-shadow:0 22px 44px -20px rgba(10,33,71,.45)}
/* invitation (home) */
.invite{background:var(--brand);color:var(--on);border-radius:26px;margin:14px 0 22px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(6,22,51,.75);animation:rise .8s ease both}
.invite .band{height:12px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,transparent 22px 26px,var(--bg) 26px 40px,transparent 40px 44px)}
.invite .inner{padding:30px 24px 20px;text-align:center}
.invite .logo{display:block;width:128px;height:auto;margin:0 auto 18px}
.pres{font:italic 500 1.2rem/1.3 var(--serif);color:var(--accent);margin:0}
.invite h1{font-size:clamp(3.4rem,17vw,5rem);margin:8px 0 0;line-height:.98;color:var(--on)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 12px;width:230px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}.orn i:last-child{background:linear-gradient(90deg,var(--accent),transparent)}
.orn b{width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
.when{margin:0;text-align:left}
.when div{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:baseline;padding:14px 2px;border-top:1px solid rgba(251,247,236,.16)}
.when dt{font:italic 500 1.1rem var(--serif);color:var(--accent)}
.when dd{margin:0;font:600 1.35rem/1.25 var(--serif);color:var(--on)}
/* progress + done */
.steps{display:flex;list-style:none;margin:16px 0 4px;padding:0}
.steps li{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:.85rem;color:var(--mute)}
.steps i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:500;font-size:.85rem;border:1px solid var(--line2);background:var(--card);position:relative;z-index:1}
.steps li:not(:last-child):after{content:"";position:absolute;top:15px;left:calc(50% + 22px);right:calc(-50% + 22px);height:1px;background:var(--line2)}
.steps li.done:not(:last-child):after{background:var(--brand)}
.steps li.done i{background:var(--brand);border-color:var(--brand);color:var(--on)}
.steps li.cur{color:var(--brand);font-weight:500}.steps li.cur i{border-color:var(--accent);color:var(--brand);box-shadow:0 0 0 4px rgba(255,164,0,.25)}
.seal{width:64px;height:64px;border-radius:50%;margin:26px auto 0;display:grid;place-items:center;font-size:1.7rem;color:var(--on);background:var(--brand);box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--accent);animation:rise .6s ease both}
.seal+h1,.seal+h1+.sub{text-align:center;margin-left:auto;margin-right:auto}
.idcard{text-align:center;border-color:var(--line2);background:linear-gradient(180deg,#fffdf8,#fbf5e4)}
.foot{text-align:center;margin:36px 0 0;color:var(--mute);font:italic 500 1.05rem var(--serif)}
.amt,h1,h2,.when dd,.when dt,.pres,.foot{font-variant-numeric:lining-nums}
.idcard .amt{font:600 2.4rem/1.1 "Jost",system-ui,sans-serif;letter-spacing:.1em;font-variant-numeric:lining-nums}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.invite,.seal{animation:none}}
</style></head>
<body>
<header class="top"><div><img src="assets/logo-mark.png" alt="" width="44" height="30"><span>Mallu Articles Bengaluru</span></div></header>
<div class="kasavu"></div>
<div id="gbar" role="status" aria-live="polite" hidden></div>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIG: change these in one place ===== */
const CONFIG={
  eventName:"Ehsaas'26",
  eventLine:"Sun 22 Nov 2026, 2 PM · Savoury Business Hotel, Madiwala",
  ticketDate:"Sunday, 22 November 2026",          // shown on the ticket
  ticketTime:"2:00 PM",                            // shown on the ticket
  ticketVenue:"Savoury Business Hotel, Madiwala",  // shown on the ticket
  organiserName:"Mallu Articles Bengaluru",        // shown on the ticket
  ticketTagline:"MALAYALEE CA MEETUP · BENGALURU", // small line at the top of the ticket
  // The UPI ID, the payee name and the organisers' WhatsApp number are NOT here any more:
  // they are set in Admin > Settings > Payment details and read from the database.
  supabaseUrl:"https://jddrwajazpsdrqpwlncu.supabase.co",
  supabaseKey:"sb_publishable_W3tJTLdbCOuwkUwkjLW1Iw_9m1zGHFT"   // publishable key: safe to be public
};
let db=null;try{db=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseKey,{auth:{persistSession:false,autoRefreshToken:false}})}catch(_){}

function uuid(){if(crypto.randomUUID)return crypto.randomUUID();
  return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=crypto.getRandomValues(new Uint8Array(1))[0]&15;return(c==="x"?r:(r&3|8)).toString(16)})}
const askEmail=()=>!(S.flags&&S.flags.ask_email===false);
function blank(){return{name:"",phone:"",email:"",loc:"",att:"",food:""}}
const S={step:"home",status:null,friends:false,n:1,people:[blank()],file:null,sid:uuid(),errs:[],payErr:"",busy:false,result:null,
  tk:{q:"",phone:"",msg:"",busy:false,res:null,nf:false,code:"",ph:""},ti:null,cur:null,cv:[],pay:null,payLoading:false,payFail:false,payChanged:false};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const price=()=>S.status?S.status.price_per_head:0;
const total=()=>S.n*price();
const maxN=()=>S.status?S.status.max_group:1;
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const lastCode=()=>{try{return(JSON.parse(localStorage.getItem("mm_last")||"null")||{}).code||""}catch(_){return""}};
const getMine=()=>LS.get("mm_mine",[]);
function remember(key,code,max){const l=LS.get(key,[]).filter(c=>c!==code);l.unshift(code);LS.set(key,l.slice(0,max))}
const normCode=t=>String(t||"").toUpperCase().replace(/O/g,"0").replace(/[\s-]/g,"");
function setN(n){S.n=n;while(S.people.length<n)S.people.push(blank());S.people.length=n}
function opt(i,k,v,cur){return `<label><input type="radio" name="p${i}_${k}" data-i="${i}" data-k="${k}" value="${v}" ${cur===v?"checked":""}><span>${v}</span></label>`}
/* ===== event date, time and venue: set by admins in Admin > Settings. CONFIG values are the backup if it can't be loaded ===== */
let evAt=0;
async function loadEvent(){
  if(!db||Date.now()-evAt<30000)return;
  try{const r=await Promise.race([db.rpc("get_event_info"),new Promise(res=>setTimeout(()=>res(null),2500))]);
    if(r&&r.data&&r.data.event_at&&r.data.venue){S.ev=r.data;evAt=Date.now()}}catch(_){}
}
function evParts(o){try{if(!S.ev)return null;const p={};new Intl.DateTimeFormat("en-GB",{...o,timeZone:"Asia/Kolkata"}).formatToParts(new Date(S.ev.event_at)).forEach(x=>p[x.type]=x.value);return p.year?p:null}catch(_){return null}}
function evDate(){const p=evParts({weekday:"long",day:"numeric",month:"long",year:"numeric"});return p?p.weekday+", "+p.day+" "+p.month+" "+p.year:CONFIG.ticketDate}
function evTime(){try{const t=S.ev&&fmtT(S.ev.event_at);if(t)return t}catch(_){}return CONFIG.ticketTime}
function evVenue(){return(S.ev&&S.ev.venue)||CONFIG.ticketVenue}
function evLine(){const p=evParts({weekday:"short",day:"numeric",month:"short",year:"numeric"});return p?p.weekday+" "+p.day+" "+p.month+" "+p.year+", "+evTime()+" · "+evVenue():CONFIG.eventLine}
function head(t,s){return `<h1>${t}</h1><p class="sub">${s}</p>`}
function closeDate(){try{return new Date(S.status.deadline).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Kolkata"})}catch(_){return""}}
/* payment details (UPI ID, payee name) and the organisers' WhatsApp number come from the database (Admin > Settings) */
function payFrom(d){d=d||{};return{upi:String(d.upi_id||""),payee:String(d.payee_name||""),wa:String(d.whatsapp||"")}}
async function loadPay(){if(!db)return false;try{const{data,error}=await db.rpc("get_payment_info");if(error)throw error;S.pay=payFrom(data);return true}catch(_){return false}}
function waLink(text){return S.pay&&S.pay.wa?"https://wa.me/"+S.pay.wa+"?text="+encodeURIComponent(text):""}
function contactBtn(text,label){const l=waLink(text);return l?`<a class="btn ghost" href="${esc(l)}" target="_blank" rel="noopener">${label||"Contact the organisers"}</a>`:""}

async function load(){
  await loadEvent();
  if(!S.pay)await loadPay();
  try{
    if(!db)throw new Error("no client");
    const{data,error}=await db.rpc("get_public_status",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until)S.step="closed";
    else{if(S.step==="loading"||S.step==="closed"||S.step==="error")S.step="form";
      if(S.n>maxN()){setN(maxN());S.friends=S.n>1}}
  }catch(_){S.step="error"}
  render();
  if(S.step==="form")beat();
}

/* ===== daily pause + 10-minute grace ===== */
let skew=0,expAt=0;
const inFill=()=>["form","summary","pay"].includes(S.step);
function applyStatus(d){S.status=d;if(d&&d.server_now)skew=new Date(d.server_now).getTime()-Date.now()}
const IST={timeZone:"Asia/Kolkata"};
function fmtT(iso){try{return new Date(iso).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true,...IST}).toUpperCase()}catch(_){return""}}
function fmtWhen(iso){try{const d=new Date(iso),day=x=>x.toLocaleDateString("en-IN",{day:"numeric",month:"short",...IST});
  return fmtT(iso)+(day(d)===day(new Date(Date.now()+skew))?"":" on "+day(d))}catch(_){return""}}
function graceMs(){return S.status&&S.status.grace_until?new Date(S.status.grace_until).getTime()-(Date.now()+skew):null}
async function beat(){
  if(!db||!inFill())return;
  try{
    const{data,error}=await db.rpc("registration_heartbeat",{p_session:S.sid});if(error)throw error;
    applyStatus(data);
    if(!data.accepting&&!data.grace_until&&inFill()&&!S.busy){S.graceLost=true;S.step="closed";render()}
  }catch(_){}
  paintBar();
  checkPay();
}
function paintBar(){
  const el=$("#gbar");if(!el)return;
  const ms=graceMs();
  if(ms!=null&&ms>0&&inFill()){
    const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;
    el.textContent=(S.status.closed_reason==="deadline"?"The registration deadline has passed, but you have ":"Registration has paused, but you have ")+m+":"+String(s).padStart(2,"0")+" left to finish your booking. Please pay, upload the screenshot and submit."+(S.status.reopen_at?" If you think your registration will take more than 10 minutes, please continue after "+fmtWhen(S.status.reopen_at)+" (when registration reopens).":"");
    el.hidden=false;
  }else{
    el.hidden=true;
    if(ms!=null&&ms<=0&&inFill()&&!S.busy&&Date.now()-expAt>5000){expAt=Date.now();beat()}
  }
}
setInterval(beat,30000);setInterval(paintBar,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)beat()});
/* ===== payment details: always fresh when the Pay step opens, and re-checked every 30 seconds while it is open ===== */
async function goPay(){
  S.step="pay";S.payErr="";S.payFail=false;S.payChanged=false;S.payLoading=true;render();
  const ok=await loadPay();
  S.payLoading=false;S.payFail=!ok;
  if(S.step==="pay")render();
}
async function checkPay(){
  if(S.step!=="pay"||S.busy||S.payLoading||S.payFail||!db)return;
  try{
    const{data,error}=await db.rpc("get_payment_info");if(error)throw error;
    const p=payFrom(data);if(S.step!=="pay"||S.busy)return;
    const changed=p.upi!==(S.pay&&S.pay.upi)||p.payee!==(S.pay&&S.pay.payee);
    S.pay=p;
    if(changed){S.payChanged=true;const y=window.scrollY;render();window.scrollTo(0,y)}
  }catch(_){}
}

function stepBar(){const i=({form:1,summary:2,pay:3})[S.step];if(!i)return"";
  return `<ol class="steps" aria-label="Progress">`+["Details","Review","Payment"].map((n,j)=>`<li class="${j+1<i?"done":j+1===i?"cur":""}"${j+1===i?' aria-current="step"':""}><i>${j+1<i?"✓":j+1}</i><span>${n}</span></li>`).join("")+`</ol>`}
function foot(){return S.step==="home"?"":`<p class="foot">${esc(CONFIG.organiserName)}</p>`}
function render(){
  const a=$("#app");document.body.dataset.step=S.step;
  a.innerHTML=stepBar()+({home:vHome,loading:()=>head("Loading…","One moment."),error:vError,closed:vClosed,form:vForm,summary:vSummary,pay:vPay,done:vDone,tickets:vTickets,ticket:vTicket,about:vAbout,xmenu:vXMenu,xsell:vXSell,xcode:vXCode,xbuy:vXBuy,xform:vXForm,xdone:vXDone,tpay:vTPay})[S.step]()+foot();
  if(S.step==="pay"&&$("#qr"))drawQR($("#qr"),upiLink());
  if(S.step==="tpay"&&$("#qr"))drawQR($("#qr"),upiLink(S.xp.amount,"Meetup ticket transfer"));
  if(S.step==="ticket")drawTickets().catch(()=>{});
  window.scrollTo(0,0);
}

function validate(){
  const e=[];S.people.forEach((p,i)=>{const w=S.n>1?"Person "+(i+1)+": ":"";
    if(!p.name.trim())e.push(w+"enter a name");
    if(!/^\d{10}$/.test(p.phone))e.push(w+"phone must be exactly 10 digits");
    if(!p.loc)e.push(w+"choose where you are currently");
    if(!p.att)e.push(w+"choose Surely or Most probably");
    if(!p.food)e.push(w+"choose Veg or Non-veg");
    if(askEmail()&&!okMail(p.email))e.push(w+"enter a valid email address")});
  return e;
}

const fbOn=()=>!!(S.flags&&S.flags.ask_feedback===true);
function fbCard(r){
  if(!fbOn())return"";
  if(!S.fb||S.fb.code!==r.booking_code)S.fb={code:r.booking_code,rating:0,comment:"",busy:false,sent:false,err:""};
  const f=S.fb;
  if(f.sent)return `<div class="card"><h2>Thank you!</h2><p style="margin:0">Your answer has reached the organisers.</p></div>`;
  return `<div class="card"><h2>Two quick questions <span class="note">(optional)</span></h2>
  <div class="lbl">Tell us how excited are you!</div>
  <div class="opts rate" role="radiogroup" aria-label="Excitement, 1 to 5">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="fb_r" data-fb="rating" value="${n}" ${f.rating===n?"checked":""}><span>${n}</span></label>`).join("")}</div>
  <p class="note" style="margin:6px 0 0">1 = a little, 5 = can't wait!</p>
  <label for="fb_c">Any suggestions/ideas/expectations from your side</label><textarea id="fb_c" data-fb="comment" maxlength="1000" rows="4">${esc(f.comment)}</textarea>
  ${f.err?`<p class="err" role="alert">${esc(f.err)}</p>`:""}
  <div class="row"><button id="fbsend" ${f.busy?"disabled":""}>${f.busy?"Sending…":"Send"}</button></div></div>`}
async function fbSend(){
  const f=S.fb;if(!f||f.busy)return;const c=f.comment.trim();
  if(!f.rating&&!c){f.err="Pick a number or write a few words first.";render();return}
  f.busy=true;f.err="";render();
  try{const{data,error}=await db.rpc("submit_feedback",{p_booking_code:f.code,p_rating:f.rating||null,p_comment:c||null});
    if(error)throw error;if(!data||!data.ok){f.err=xerr(data);f.busy=false;render();return}
    f.sent=true;f.busy=false;render()}
  catch(_){f.err="Could not send. Please check your internet and try again.";f.busy=false;render()}}

const phoneBox=(id,attr,val,ph)=>`<div class="pf"><span aria-hidden="true">+91</span><input type="tel" class="ph" id="${id}" ${attr} value="${esc(val||"")}" inputmode="numeric" placeholder="${ph||"10 digits"}" autocomplete="off" aria-label="Phone number, 10 digits, India +91"></div>`;
const optX=(k,v,cur)=>`<label><input type="radio" name="x_${k}" data-x="${k}" value="${v}" ${cur===v?"checked":""}><span>${v}</span></label>`;
/* a pasted number such as "+91 98765-43210", "919876543210" or "09876543210" becomes the plain 10 digits */
const cleanPhone=v=>{let d=String(v||"").replace(/\D/g,"");if(d.length===12&&d.startsWith("91"))d=d.slice(2);else if(d.length===11&&d[0]==="0")d=d.slice(1);return d.slice(0,10)};
const okMail=e=>{e=String(e||"").trim();return e.length>=5&&e.length<=120&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)};
const XERR={MISMATCH:"Submission failed due to details mismatch. Please check the Booking ID, the ticket number and the phone number of that ticket.",TRANSFERS_CLOSED:"Ticket transfers are not open right now.",CUTOFF_PASSED:"The last date for ticket transfers has passed.",NOT_CONFIRMED:"This ticket is not confirmed yet, so it cannot be transferred.",
  COORDINATOR:"Coordinator tickets cannot be transferred here. Please contact the organisers.",ALREADY_CHECKED_IN:"This ticket has already been used at the entry.",ALREADY_TRANSFERRED:"This ticket has already been transferred.",ALREADY_PENDING:"A buyer has already applied for this ticket. The organisers are handling it. Please wait or contact them.",
  TRY_AGAIN:"Something collided. Please tap the button again.",INVALID_UPI:"That payout UPI ID or phone number doesn't look right. Use name@bank or a 10-digit number.",INVALID_CODE:"Invalid code. Please check it, or ask for a new one. Codes stop working after a while.",NOT_AVAILABLE:"This ticket is no longer available for transfer.",
  INVALID_NAME:"Please enter your name.",INVALID_PHONE:"Phone must be exactly 10 digits.",INVALID_EMAIL:"Please enter a valid email address.",FEEDBACK_OFF:"Sorry, answers are not being collected any more.",EMPTY_FEEDBACK:"Pick a number or write a few words first.",INVALID_RATING:"Please pick a number from 1 to 5.",INVALID_COMMENT:"That message is too long. Please keep it under 1000 characters.",BOOKING_NOT_FOUND:"We could not find this booking.",INVALID_LOCATION:"Please choose where you are currently.",INVALID_ATTENDANCE:"Please choose Surely or Most probably.",INVALID_FOOD:"Please choose Veg or Non-veg.",INVALID_CONSENT:"Please tick the box to confirm you understand.",INVALID_DATA:"Some details were not accepted. Please check each field.",
  CONTACT_ADMIN:"A buyer has already applied. Only the organisers can end this now. Please contact them.",NOTHING_TO_CANCEL:"There is no active code to cancel.",NOT_ACTIVE:"This transfer is no longer open.",PAYMENT_NOT_REQUESTED:"The organisers have not asked for payment yet.",ALREADY_SUBMITTED:"You have already uploaded a payment screenshot.",SCREENSHOT_MISSING:"The screenshot did not upload. Please select it again."};
const xerr=r=>XERR[r&&r.error]||"Something went wrong. Please try again.";
const waTxt=t=>contactBtn(t,"Contact the organisers");

const savedIds=()=>{const a=getMine().concat(LS.get("mm_hist",[]));return a.filter((c,i)=>a.indexOf(c)===i).slice(0,12)};
function loadTI(){if(!db)return Promise.resolve();return db.rpc("get_transfer_info").then(r=>{S.ti=r.error?null:r.data}).catch(()=>{S.ti=null})}
const xOpen=()=>!!(S.ti&&S.ti.open&&!S.ti.cutoff_passed);
const NF=`<div class="card"><b>No ticket found for these details.</b><p class="note">Check the Booking ID and use the phone number that was entered for that person. The letter O and the number 0 are treated the same.</p><div class="row">${"@@HELP@@"}</div></div>`;
function pill(c,t){return `<span class="pill p-${c}">${t}</span>`}
function transferNote(tr){
  if(!tr||!tr.transfers||!tr.transfers.length)return"";
  const L={code_active:"Code active",pending_admin:"A buyer has applied",done:"Transferred",rejected:"Not approved",withdrawn:"Closed",replaced:"Replaced by a newer code",expired:"Code expired"};
  return `<div class="card"><b>Your transfers</b>`+tr.transfers.map(x=>{
    let h=`<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><div class="sw"><span>${esc(x.ticket_label||"")} · ${x.mode==="public"?"Public":"Private"}</span>${pill(x.status==="done"?"ok":x.status==="rejected"||x.status==="withdrawn"||x.status==="expired"?"bad":"wait",L[x.status]||esc(x.status))}</div>`;
    if(x.status==="code_active"&&x.code)h+=`<div class="note" style="margin-top:6px">Code <b style="letter-spacing:.15em;font-size:1.1rem">${esc(x.code)}</b> · valid until ${esc(fmtWhen(x.expires_at))}</div><div class="row"><button class="ghost" data-xcancel="${esc(x.ticket_label)}">Cancel this code</button></div>`;
    if(x.status==="pending_admin")h+=`<p class="note" style="margin:6px 0 0">${x.buyer_name?esc(x.buyer_name)+" has applied. ":""}The organisers may call your registered number to confirm before anything changes. Your ticket stays valid until then.</p>`;
    if(x.status==="done"){h+=`<p class="note" style="margin:6px 0 0">${x.buyer_name?"Your ticket now belongs to "+esc(x.buyer_name)+".":"Your ticket was transferred."}`;
      if(x.mode==="public"&&x.amount_to_receive)h+=x.payout==="paid"?` You have been paid ₹${esc(x.amount_to_receive)}.`:` The organisers will pay you ₹${esc(x.amount_to_receive)} on the payout UPI ID / number you gave.`;
      h+=`</p>`}
    if(x.status==="rejected")h+=`<p class="note" style="margin:6px 0 0">The organisers did not approve this transfer. Your ticket is unchanged.</p>`;
    return h+`</div>`}).join("")+`</div>`}
function bookingCard(d){
  const msg="Hi, I'm checking on my "+CONFIG.eventName+" booking, ID "+d.booking_code+".";
  const idl=`<b style="letter-spacing:.08em">${esc(d.booking_code)}</b>`;
  const live=d.tickets.filter(t=>!t.transferred),moved=d.tickets.filter(t=>t.transferred);
  const names=d.tickets.length?`<ul class="names">`+d.tickets.map(t=>`<li>${esc(t.name)} <span class="note">· ${esc(t.food)}${t.label&&t.label!=="—"?" · "+esc(t.label):""}</span>${t.transferred?` ${pill("wait","Transferred")}`:""}</li>`).join("")+`</ul>`:"";
  if(d.kind==="transfer"){
    const tr=d.transfer||{},st=tr.state,w=(c,t)=>`<div class="sw">${idl}${pill(c,t)}</div>`;
    if(d.status==="paid")return `<div class="card">${w("ok","Confirmed")}<p style="margin:10px 0 0">Your transfer is complete. This is now your ticket.</p>${names}<div class="row"><button data-view="1">View Ticket</button></div></div>`;
    const T={pending:["wait","Pending verification","The organisers have been notified. They may call the seller to confirm"+(tr.type==="public"?", then ask you to pay the standard ticket price here":"")+". Please check back here."],
      payment_due:["wait","Payment needed","The organisers confirmed with the seller. Please pay ₹"+esc(tr.amount_due)+" and upload the payment screenshot."],
      payment_submitted:["wait","Payment received for checking","Your screenshot is with the organisers. They are checking it against the bank."],
      payment_verified:["wait","Payment verified","Your payment is verified. The organisers will complete the transfer shortly."],
      rejected:["bad","Not approved","This transfer was not approved. Please contact the organisers."],
      return_due:["bad","Not approved · refund due","This transfer could not be completed. Your payment will be returned. Please contact the organisers if it takes long."],
      returned:["ok","Payment returned","This transfer could not be completed and your payment has been returned."]}[st]||["wait","Pending verification",""];
    return `<div class="card">${w(T[0],T[1])}<p style="margin:10px 0 0">${T[2]}</p><div class="row">${st==="payment_due"?`<button data-tpay="1">Pay ₹${esc(tr.amount_due)}</button>`:""}${contactBtn(msg)}</div></div>`}
  if(d.status==="paid")return `<div class="card"><div class="sw">${idl}${pill("ok","Confirmed")}</div>${names}<div class="row">${live.length?`<button data-view="1">View Ticket${live.length>1?"s":""}</button>`:""}${live.length&&xOpen()?`<button class="ghost" data-xstart="1">Transfer a ticket</button>`:""}</div>${moved.length&&!live.length?`<p class="note">This ticket was transferred to someone else.</p>`:""}</div>`+transferNote(d.xstatus);
  if(d.status==="rejected")return `<div class="card"><div class="sw">${idl}${pill("bad","Not verified")}</div>${names}<p class="err">Payment couldn't be verified. Please contact the organisers.</p><div class="row">${contactBtn(msg)}</div></div>`;
  return `<div class="card"><div class="sw">${idl}${pill("wait","Pending verification")}</div>${names}<p class="note">We're checking your payment. If it's taking long, contact the organisers.</p><div class="row">${contactBtn(msg)}</div></div>`;
}

async function doSearch(){
  const T=S.tk,code=normCode(T.q),ph=String(T.phone||"").replace(/\D/g,"");T.msg="";T.res=null;T.nf=false;
  if(!/^[0-9A-F]{8}$/.test(code)||!/^\d{10}$/.test(ph)){T.nf=true;return render()}
  T.busy=true;render();
  try{
    const{data,error}=await db.rpc("lookup_tickets",{p_code:code,p_phone:ph});if(error)throw error;
    if(data&&data.found){
      remember("mm_hist",code,10);
      if(data.kind==="registration"&&data.status==="paid"){try{const x=await db.rpc("transfer_status",{p_booking_code:code,p_phone:ph});data.xstatus=x.error||!x.data||!x.data.found?null:x.data}catch(_){}}
      T.res=data;T.code=code;T.ph=ph;
    }else T.nf=true;
  }catch(_){T.msg="Could not reach the server. Check your internet and try again."}
  T.busy=false;const y=window.scrollY;render();window.scrollTo(0,y);
}

async function xSell(){
  const x=S.xs;if(x.busy)return;x.err="";
  const code=normCode(x.code),ph=String(x.phone||"").replace(/\D/g,"");
  if(!/^[0-9A-F]{8}$/.test(code)||!x.ticket.trim()||!/^\d{10}$/.test(ph)||(x.mode==="public"&&!x.upi.trim())){x.err="Please fill in every box. The phone number must be 10 digits.";return render()}
  x.busy=true;render();
  try{
    const a={p_booking_code:code,p_ticket:x.ticket.trim(),p_phone:ph};if(x.mode==="public")a.p_upi=x.upi.trim();
    const{data,error}=await db.rpc(x.mode==="public"?"public_sell":"private_sell",a);if(error)throw error;
    if(data&&data.ok){x.res=data;S.step="xcode";x.busy=false;return render()}
    x.err=xerr(data);
  }catch(_){x.err="Could not reach the server. Check your internet and try again."}
  x.busy=false;render();
}
async function xOpenCode(){
  const b=S.xb;if(b.busy)return;b.err="";const c=String(b.code||"").toUpperCase().replace(/[\s-]/g,"");
  if(!/^[A-Z2-9]{6}$/.test(c)){b.err="Please type the 6-character code.";return render()}
  b.busy=true;render();
  try{
    const{data,error}=await db.rpc("transfer_open",{p_code:c});if(error)throw error;
    if(data&&data.ok){if(b.sidFor!==c){b.sid=uuid();b.sidFor=c}   /* one submission ID per code: a retry of the same form is safe, a different code is a new request */
      Object.assign(b,{mode:data.mode,seller_name:data.seller_name,food_locked:!!data.food_locked,food:data.food||"",code:c});if(b.food_locked)b.food=data.food;S.step="xform";b.busy=false;return render()}
    b.err=xerr(data);
  }catch(_){b.err="Could not reach the server. Check your internet and try again."}
  b.busy=false;render();
}
async function xSubmit(){

async function tPaySubmit(){
  const p=S.xp;if(p.busy)return;p.err="";
  if(!p.file){p.err="Upload your payment screenshot to continue.";return render()}
  p.busy=true;render();
  try{
    const blob=await compress(p.file),ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[blob.type];
    if(!ext)p.err="Please upload the screenshot as a JPG or PNG image.";
    else{
      const path=p.sid+"."+ext,up=await db.storage.from("payment-proofs").upload(path,blob,{contentType:blob.type,upsert:false});
      if(up.error&&!/exist|duplicate|409/i.test((up.error.message||"")+(up.error.statusCode||"")))throw up.error;
      const{data,error}=await db.rpc("transfer_pay",{p_booking_code:p.code,p_phone:p.ph,p_submission_id:p.sid,p_screenshot_path:path});if(error)throw error;
      if(data&&data.ok){p.busy=false;toast("Payment received. The organisers will check it.",3500);S.step="tickets";S.tk.q=p.code;S.tk.phone=p.ph;return doSearch()}
      p.err=xerr(data);
    }
  }catch(_){p.err="Could not reach the server. Check your internet and tap Submit again. Tapping again will not create a duplicate."}
  p.busy=false;render();
}

/* ---------- ticket drawing (canvas) ---------- */
const TW=900,TH=1480;
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}
const FF='"Jost",Arial,sans-serif',FD='"Fraunces",Georgia,serif';
function txt(x,s,X,Y,size,wt,col,al,sp,fam){x.font=wt+" "+size+"px "+(fam||FF);x.fillStyle=col;x.textAlign=al||"left";x.textBaseline="alphabetic";try{x.letterSpacing=(sp||0)+"px"}catch(_){}x.fillText(s,X,Y);try{x.letterSpacing="0px"}catch(_){}}
function fit(x,s,maxW,size,min,wt,fam){let z=size;for(;z>min;z-=2){x.font=wt+" "+z+"px "+(fam||FF);if(x.measureText(s).width<=maxW)break}return z}
function foodMark(x,X,Y,veg){const col=veg?"#1f9d55":"#c62828";x.fillStyle="#fff";rr(x,X,Y,48,48,8);x.fill();x.lineWidth=5;x.strokeStyle=col;rr(x,X+2.5,Y+2.5,43,43,6);x.stroke();x.fillStyle=col;x.beginPath();x.arc(X+24,Y+24,11,0,7);x.fill()}
let LOGO=null;
function loadLogo(){return new Promise(r=>{if(LOGO)return r(LOGO);const i=new Image();i.onload=()=>{LOGO=i;r(i)};i.onerror=()=>r(null);i.src="assets/logo-mark.png"})}
function drawTicket(c,t,code){
  const coord=t.kind==="coordinator",W=TW,H=TH,NAVY="#0A2147",AMB="#FFA400",AI="#8A5200",IVO="#FBF7EC";
  const P=coord?{acc:"#7d1c32",top:"#fff9f4",bot:"#f6e9e0",ink:"#2a1218",mute:"#7a5a5f"}:{acc:NAVY,top:"#fffdf7",bot:"#f6efdc",ink:"#13203B",mute:"#576179"};
  c.width=W;c.height=H;const x=c.getContext("2d");x.clearRect(0,0,W,H);
  x.save();rr(x,0,0,W,H,52);x.clip();
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,P.top);g.addColorStop(1,P.bot);x.fillStyle=g;x.fillRect(0,0,W,H);
  // dark header with the logo
  x.fillStyle=NAVY;x.fillRect(0,0,W,486);
  for(let i=0;i<W;i+=44){x.fillStyle=AMB;x.fillRect(i,486,22,14);x.fillStyle=IVO;x.fillRect(i+26,486,14,14)}
  for(let i=0;i<W;i+=44){x.fillStyle=AMB;x.fillRect(i,H-14,22,14);x.fillStyle=NAVY;x.fillRect(i+26,H-14,14,14)}
  if(LOGO){const lw=184,lh=lw*LOGO.height/LOGO.width;x.drawImage(LOGO,(W-lw)/2,30,lw,lh)}
  // badge
  const kind=coord?"COORDINATOR":"ADMIT ONE";x.font="600 26px "+FF;try{x.letterSpacing="7px"}catch(_){}const pw=x.measureText(kind).width+64;try{x.letterSpacing="0px"}catch(_){}
  x.fillStyle=coord?IVO:AMB;rr(x,(W-pw)/2,184,pw,52,26);x.fill();txt(x,kind,W/2+3,220,26,"600",coord?"#7d1c32":NAVY,"center",7);
  txt(x,CONFIG.ticketTagline,W/2+2,272,21,"500","rgba(251,247,236,.78)","center",4);
  const ts=fit(x,CONFIG.eventName,740,146,60,"700",FD);txt(x,CONFIG.eventName,W/2,412,ts,"700",IVO,"center",0,FD);
  txt(x,"presented by "+CONFIG.organiserName,W/2,464,30,"italic 500",AMB,"center",0,FD);
  // frames
  x.lineWidth=2;x.strokeStyle=AMB;x.globalAlpha=.7;rr(x,44,534,W-88,536,30);x.stroke();rr(x,44,1128,W-88,320,30);x.stroke();x.globalAlpha=1;
  // details
  [["Date",evDate()],["Time",evTime()],["Venue",evVenue()]].forEach((r,i)=>{
    const y=584+i*104;txt(x,r[0],90,y,30,"italic 500",AI,"left",0,FD);
    const sz=fit(x,r[1],720,40,24,"500");txt(x,r[1],90,y+48,sz,"500",P.ink,"left",0)});
  // attendee
  txt(x,"Attendee",90,902,30,"italic 500",AI,"left",0,FD);
  const ns=fit(x,t.name,720,80,36,"700",FD);txt(x,t.name,90,980,ns,"700",P.acc,"left",0,FD);
  const veg=t.food==="Veg";foodMark(x,90,996,veg);txt(x,veg?"Veg":"Non-veg",154,1032,34,"500",P.ink,"left",0);
  // perforation
  x.setLineDash([14,12]);x.strokeStyle=AMB;x.globalAlpha=.9;x.lineWidth=3;x.beginPath();x.moveTo(60,1100);x.lineTo(W-60,1100);x.stroke();x.setLineDash([]);x.globalAlpha=1;
  x.globalCompositeOperation="destination-out";x.beginPath();x.arc(0,1100,34,0,7);x.fill();x.beginPath();x.arc(W,1100,34,0,7);x.fill();x.globalCompositeOperation="source-over";
  // stub
  txt(x,"Ticket number",90,1196,30,"italic 500",AI,"left",0,FD);
  const tl=t.label||"—",ls=fit(x,tl,420,84,40,"600");txt(x,tl,90,1278,ls,"600",P.acc,"left",1);
  txt(x,"Admits one person, one entry",90,1352,30,"italic 500",AI,"left",0,FD);
  txt(x,"Show this QR at the entry",90,1396,24,"400",P.mute,"left",0);
  // QR
  x.fillStyle="#fff";rr(x,556,1148,280,280,24);x.fill();x.lineWidth=2;x.strokeStyle=AMB;x.globalAlpha=.8;x.stroke();x.globalAlpha=1;
  if(t.secret&&t.label){
    const q=qrcode(0,"M");q.addData(t.label+"|"+t.secret);q.make();const m=q.getModuleCount(),k=Math.floor(240/m),o=556+(280-m*k)/2,p=1148+(280-m*k)/2;
    x.fillStyle="#000";for(let r=0;r<m;r++)for(let cc=0;cc<m;cc++)if(q.isDark(r,cc))x.fillRect(o+cc*k,p+r*k,k,k);
  }else txt(x,"Not ready",696,1296,30,"600","#444","center",0);
  x.restore();
}

/* ---------- downloads (JPG / PDF) ---------- */
function slug(s){return(String(s).replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,30))||"ticket"}
function fname(t){return "Ehsaas26-"+(t.label||"ticket")+"-"+slug(t.name)}
function jpegBlob(c){const e=document.createElement("canvas");e.width=c.width;e.height=c.height;const x=e.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,e.width,e.height);x.drawImage(c,0,0);
  return new Promise(r=>e.toBlob(r,"image/jpeg",.95))}
function saveBlob(b,name){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function makePDF(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=v=>{const b=typeof v==="string"?enc.encode(v):v;parts.push(b);len+=b.length};
  const obj=(id,body)=>{offs[id]=len;push(id+" 0 obj\n"+body+"\nendobj\n")};
  push("%PDF-1.4\n");push(new Uint8Array([37,226,227,207,211,10]));
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,"<< /Type /Pages /Kids ["+imgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] /Count "+imgs.length+" >>");
  imgs.forEach((im,i)=>{const W=im.w/2,H=im.h/2,p=3+3*i;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;obj(p+1,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[p+2]=len;push(`${p+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push("\nendstream\nendobj\n")});
  const total=3+3*imgs.length,xr=len;push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function pdfOf(idx){const out=[];for(const i of idx){const c=S.cv[i],b=await jpegBlob(c);out.push({w:c.width,h:c.height,bytes:new Uint8Array(await b.arrayBuffer())})}return makePDF(out)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function downloadTicket(kind,i){
  const t=S.cur.tickets[i];if(!S.cv[i])return toast("Ticket is still loading, try again");
  if(kind==="jpg")saveBlob(await jpegBlob(S.cv[i]),fname(t)+".jpg");else saveBlob(await pdfOf([i]),fname(t)+".pdf");
}
async function downloadAll(kind){
  const r=S.cur,idx=r.tickets.map((_,i)=>i);if(idx.some(i=>!S.cv[i]))return toast("Tickets are still loading, try again");
  if(kind==="pdf")saveBlob(await pdfOf(idx),"Ehsaas26-"+(r.tickets[0].label||"tickets")+"-tickets.pdf");
  else for(const i of idx){saveBlob(await jpegBlob(S.cv[i]),fname(r.tickets[i])+".jpg");await sleep(500)}
}

function drawQR(c,text){
  const q=qrcode(0,"M");q.addData(text);q.make();const m=q.getModuleCount(),k=8,pad=4*k;
  c.width=c.height=m*k+pad*2;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
  for(let r=0;r<m;r++)for(let col=0;col<m;col++)if(q.isDark(r,col))x.fillRect(pad+col*k,pad+r*k,k,k);
}
function toast(t,ms){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200)}
const shownAmt=()=>S.step==="tpay"?S.xp.amount:total();
const blobQR=()=>new Promise(r=>$("#qr").toBlob(r,"image/png"));
async function download(){const b=await blobQR(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meetup-upi-"+shownAmt()+".png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function compress(file){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{try{const k=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size?b:file)},"image/jpeg",.8)}catch(_){res(file)}};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}

/* A finished booking must never leave its form data or its submission ID behind: the ID is what makes a re-tap idempotent, so reusing it would hand back the OLD booking and ignore new details. */
function resetBookingForm(){
  S.sid=uuid();S.graceLost=false;S.people=[blank()];S.n=1;S.friends=false;
  try{if(S.fileUrl)URL.revokeObjectURL(S.fileUrl)}catch(_){}
  S.file=null;S.fileUrl=null;S.errs=[];S.payErr="";S.fb=null}
async function submit(){
  if(S.busy)return;
  if(!S.file){$("#ferr").textContent="Upload your payment screenshot to continue.";return}
  S.busy=true;S.payErr="";const btn=$("#submit");btn.disabled=true;btn.textContent="Submitting…";
  try{
    const blob=await compress(S.file);
    const ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[blob.type];
    if(!ext)S.payErr="Please upload the screenshot as a JPG or PNG image.";
    else{
      const path=S.sid+"."+ext;
      const up=await db.storage.from("payment-proofs").upload(path,blob,{contentType:blob.type,upsert:false});
      if(up.error&&!/exist|duplicate|409/i.test((up.error.message||"")+(up.error.statusCode||"")))throw up.error;
      const{data,error}=await db.rpc("submit_booking",{p_submission_id:S.sid,
        p_people:S.people.map(p=>({name:p.name.trim(),phone:p.phone,email:askEmail()?p.email.trim().toLowerCase():"",loc:p.loc,att:p.att,food:p.food})),p_screenshot_path:path});
      if(error)throw error;
      S.result=data;S.step="done";resetBookingForm();
      try{localStorage.setItem("mm_last",JSON.stringify({code:data.booking_code}))}catch(_){}
      remember("mm_mine",data.booking_code,20);
    }
  }catch(e){
    const m=(e&&e.message)||String(e);
    if(/NOT_ENOUGH_SPOTS|REGISTRATION_CLOSED/.test(m)){
      S.busy=false;S.graceLost=/REGISTRATION_CLOSED/.test(m);S.step="loading";await load();
      if(S.step==="form")S.errs=["Spots ran out while you were registering. Please reduce the number of people, or try again later."];
      render();return}
    else if(/INVALID_/.test(m)){S.step="form";S.errs=["Some details were not accepted ("+(m.match(/INVALID_\w+/)||[""])[0]+"). Please check each field."]}
    else if(/SCREENSHOT_MISSING/.test(m))S.payErr="The screenshot did not upload. Please select it again and submit.";
    else S.payErr="Could not reach the server. Check your internet and tap Submit again. Tapping again will not create a duplicate booking. (Technical detail: "+m.slice(0,140)+")"
  }finally{S.busy=false}
  render();
}

  if(t.dataset.x)S.xb[t.dataset.x]=t.value;

  if(t.id==="fr"){S.friends=t.checked;setN(t.checked?2:1);render()}

  else if(t.id==="tshot"){const f=t.files[0],P=S.xp;
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){P.err="Choose an image file (a screenshot or photo).";t.value="";P.file=null;P.fileUrl=null;render()}
    else{try{if(P.fileUrl)URL.revokeObjectURL(P.fileUrl)}catch(_){}P.file=f||null;P.fileUrl=f?URL.createObjectURL(f):null;P.err="";render()}}
  else if(t.id==="shot"){const f=t.files[0];
    if(f&&(!f.type.startsWith("image/")||f.size>25*1048576)){$("#ferr").textContent="Choose an image file (a screenshot or photo).";t.value="";S.file=null;S.fileUrl=null}else{try{if(S.fileUrl)URL.revokeObjectURL(S.fileUrl)}catch(_){}S.file=f||null;S.fileUrl=f?URL.createObjectURL(f):null;S.payErr="";render()}}});
document.addEventListener("click",async e=>{const el=e.target.closest("button,a"),id=el?el.id:"",ds=el?el.dataset:{};
  if(id==="go-home"){S.step="home";render()}
  if(id==="go-about"){S.step="about";render()}
  if(id==="go-register"){S.step="loading";render();load()}
  if(id==="go-tickets")openTickets(S.step==="done"&&S.result?S.result.booking_code:S.step==="xdone"&&S.xb.result?S.xb.result.booking_code:"");
  if(id==="back-tickets"){S.step="tickets";render()}
  if(id==="tsearch")doSearch();
  if(id==="trefresh"){S.tk.msg="";await doSearch();toast("Status refreshed")}
  if(ds.hist){S.tk.q=ds.hist;S.tk.res=null;S.tk.nf=false;render();const ph=$("#tkph");if(ph)ph.focus()}
  if(ds.view)viewTickets();
  /* ----- transfers ----- */
  if(id==="go-xmenu"){S.step="xmenu";render();loadTI().then(()=>{if(S.step==="xmenu")render()})}
  if(ds.xstart){const d=S.tk.res;S.xs={mode:"private",code:d?d.booking_code:"",ticket:"",phone:S.tk.ph||"",upi:"",busy:false,err:"",res:null};S.step="xmenu";render()}
  if(ds.xgo){const[m,sd]=ds.xgo.split("-");if(sd==="sell"){const keep=S.xs;S.xs={mode:m,code:keep.code||"",ticket:keep.ticket||"",phone:keep.phone||"",upi:"",busy:false,err:"",res:null};S.step="xsell"}else{S.xb={code:"",busy:false,err:""};S.step="xbuy"}render()}
  if(id==="xsell")xSell();
  if(id==="copycode"){try{await navigator.clipboard.writeText(S.xs.res.code);toast("Code copied")}catch(_){toast("Press and hold the code to copy")}}
  if(id==="go-xbuy"){S.step="xbuy";render()}
  if(id==="xopen")xOpenCode();
  if(id==="xsubmit")xSubmit();
  if(id==="fbsend")fbSend();
  if(id==="copyxid"){try{await navigator.clipboard.writeText(S.xb.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(ds.xcancel&&S.tk.code){if(!confirm("Cancel this transfer code? Nobody will be able to use it."))return;
    try{const{data,error}=await db.rpc("transfer_cancel",{p_booking_code:S.tk.code,p_ticket:ds.xcancel,p_phone:S.tk.ph});if(error)throw error;
      if(data&&data.ok){toast("Code cancelled");await doSearch()}else toast(xerr(data),4500)}catch(_){toast("Could not reach the server. Try again.",3500)}}
  if(ds.tpay&&S.tk.res&&S.tk.res.transfer){S.xp={code:S.tk.code,ph:S.tk.ph,amount:S.tk.res.transfer.amount_due,sid:uuid(),file:null,fileUrl:null,busy:false,err:""};S.step="tpay";S.payLoading=true;S.payFail=false;render();loadPay().then(ok=>{S.payLoading=false;S.payFail=!ok;if(S.step==="tpay")render()})}
  if(id==="tp-back"&&!S.xp.busy){S.step="tickets";render()}
  if(id==="tp-retry"){S.payLoading=true;S.payFail=false;render();loadPay().then(ok=>{S.payLoading=false;S.payFail=!ok;if(S.step==="tpay")render()})}
  if(id==="tp-submit")tPaySubmit();
  if(ds.dl)downloadTicket(ds.dl,+ds.i);
  if(id==="dl-all-pdf")downloadAll("pdf");
  if(id==="dl-all-jpg")downloadAll("jpg");
  if(id==="retry"||id==="recheck"){S.graceLost=false;S.step="loading";render();load()}
  if(id==="review"){S.errs=validate();if(S.errs.length)render();else{S.step="summary";render()}}
  if(id==="edit"){S.step="form";S.errs=[];render()}
  if(id==="topay")goPay();
  if(id==="payretry")goPay();
  if(id==="back"&&!S.busy){S.step="summary";render()}
  if(id==="copy"){try{await navigator.clipboard.writeText(S.pay.upi);toast("UPI ID copied")}catch(_){toast("Press and hold the UPI ID to copy")}}
  if(id==="copyid"){try{await navigator.clipboard.writeText(S.result.booking_code);toast("Booking ID copied")}catch(_){toast("Press and hold the ID to copy")}}
  if(id==="dl")download();
  if(id==="share"){const b=await blobQR(),f=new File([b],"meetup-upi-"+shownAmt()+".png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Pay ₹"+shownAmt()})}catch(_){}}
    else{await download();toast("Sharing isn't supported here, so the QR was downloaded")}}
  if(id==="submit")submit();
  if(id==="again"){resetBookingForm();S.result=null;S.step="loading";render();load()}
});
render();loadEvent().then(()=>{if(S.step==="home")render()});
